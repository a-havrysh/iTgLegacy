  <text x="72" y="164" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff">x</text>
  <image x="86" y="146" width="98" height="26" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="128" y="163" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">from: Nadia</text>
  <text x="174" y="164" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff">x</text>
  <image x="188" y="146" width="94" height="26" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="228" y="163" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">since 1 Aug</text>
  <text x="272" y="164" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff">x</text>
