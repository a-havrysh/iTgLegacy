  <text x="55" y="296" font-family="Helvetica" font-size="13" fill="#888888"><tspan fill="#345f8f" font-weight="bold">Nadia: </tspan><tspan fill="#0779d0">#redesign</tspan> branch is green</text>

  <image x="0" y="306" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="311" width="40" height="40" rx="4" ry="4" fill="#eb7002"/>
  <text x="25" y="337" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">MW</text>
  <text x="54" y="331" font-family="Helvetica" font-size="19" fill="#111111">Marketing Weekly</text>
  <text x="311" y="328" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">11 Aug</text>
  <text x="55" y="347" font-family="Helvetica" font-size="13" fill="#888888"><tspan fill="#345f8f" font-weight="bold">Nadia: </tspan>slides for <tspan fill="#0779d0">#redesign</tspan> attached</text>

  <image x="0" y="357" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="362" width="40" height="40" rx="4" ry="4" fill="#41a903"/>
  <text x="25" y="388" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <text x="54" y="382" font-family="Helvetica" font-size="19" fill="#111111">Design Team</text>
  <text x="311" y="379" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">8 Aug</text>
  <text x="55" y="398" font-family="Helvetica" font-size="13" fill="#888888"><tspan fill="#345f8f" font-weight="bold">Nadia: </tspan>kick-off notes <tspan fill="#0779d0">#redesign</tspan></text>

  <image x="0" y="408" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="413" width="40" height="40" rx="4" ry="4" fill="#fc4380"/>
  <text x="25" y="439" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">PR</text>
  <text x="54" y="433" font-family="Helvetica" font-size="19" fill="#111111">Product Room</text>
  <text x="311" y="430" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">5 Aug</text>
  <text x="55" y="449" font-family="Helvetica" font-size="13" fill="#888888"><tspan fill="#345f8f" font-weight="bold">Nadia: </tspan>who owns <tspan fill="#0779d0">#redesign</tspan> icons?</text>

  <image x="0" y="459" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="464" width="40" height="40" rx="4" ry="4" fill="#0f94ed"/>
  <text x="25" y="490" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">SD</text>
  <text x="54" y="478" font-family="Helvetica" font-size="19" fill="#111111">Support Desk</text>
