  <image x="0" y="204" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="209" width="40" height="40" rx="4" ry="4" fill="#41a903"/>
  <text x="25" y="235" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <text x="54" y="229" font-family="Helvetica" font-size="19" fill="#111111">Design Team</text>
  <text x="311" y="226" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">14:02</text>
  <text x="55" y="245" font-family="Helvetica" font-size="13" fill="#888888"><tspan fill="#345f8f" font-weight="bold">Nadia: </tspan>shipping <tspan fill="#0779d0">#redesign</tspan> tonight</text>

  <image x="0" y="255" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="260" width="40" height="40" rx="4" ry="4" fill="#00a1c4"/>
  <text x="25" y="286" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">IO</text>
