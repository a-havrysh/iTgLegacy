<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="68" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="45" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Work</text>
  <image x="263" y="27" width="52" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="289" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit</text>
  <text x="160" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Folders</text>

  <!-- section divider -->
  <image x="0" y="64" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDividerFirst"/>
  <text x="10" y="82" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">Chat lists</text>

  <!-- row: All Chats (51pt rows, 40 glyph at x=5, text at x=49) -->
  <image x="0" y="90" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="95" width="40" height="40" rx="4" ry="4" fill="#0f94ed"/>
  <path d="M 14 106 h 22 M 14 114 h 22 M 14 122 h 14" stroke="#ffffff" stroke-width="3" fill="none"/>
  <text x="49" y="112" font-family="Helvetica" font-size="19" fill="#111111">All Chats</text>
  <text x="49" y="129" font-family="Helvetica" font-size="13" fill="#888888">36 chats</text>
  <image x="253" y="105" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="266" y="120" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
  <image x="292" y="107" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>
  <rect x="0" y="140.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row: Unread -->
  <image x="0" y="141" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="146" width="40" height="40" rx="4" ry="4" fill="#41a903"/>
  <circle cx="25" cy="166" r="8" fill="#ffffff"/>
  <text x="49" y="163" font-family="Helvetica" font-size="19" fill="#111111">Unread</text>
  <text x="49" y="180" font-family="Helvetica" font-size="13" fill="#888888">7 chats</text>
  <image x="253" y="156" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="266" y="171" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <image x="292" y="158" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>
  <rect x="0" y="191.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row: Work, currently open (checkmark) -->
  <image x="0" y="192" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:CellHighlighted102"/>
  <rect x="5" y="197" width="40" height="40" rx="4" ry="4" fill="#e09602"/>
  <rect x="14" y="209" width="22" height="16" rx="2" ry="2" fill="#ffffff"/>
  <rect x="14" y="205" width="10" height="4" rx="1" ry="1" fill="#ffffff"/>
  <text x="49" y="214" font-family="Helvetica" font-size="19" font-weight="bold" fill="#ffffff">Work</text>
  <text x="49" y="231" font-family="Helvetica" font-size="13" fill="#ffffff">9 chats</text>
  <image x="253" y="207" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge_Highlighted"/>
  <text x="266" y="222" font-family="Helvetica" font-size="14" font-weight="bold" fill="#2371c2" text-anchor="middle">4</text>
  <image x="292" y="209" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator_Highlighted"/>
  <rect x="0" y="242.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row: Family -->
  <image x="0" y="243" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="248" width="40" height="40" rx="4" ry="4" fill="#fc4380"/>
  <circle cx="20" cy="263" r="5" fill="#ffffff"/>
  <circle cx="31" cy="266" r="4" fill="#ffffff"/>
  <path d="M 12 280 a 9 9 0 0 1 18 0 z" fill="#ffffff"/>
  <text x="49" y="265" font-family="Helvetica" font-size="19" fill="#111111">Family</text>
  <text x="49" y="282" font-family="Helvetica" font-size="13" fill="#888888">5 chats</text>
  <image x="292" y="260" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>
  <rect x="0" y="293.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row: Archived -->
  <image x="0" y="294" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="299" width="40" height="40" rx="4" ry="4" fill="#8b97a5"/>
  <rect x="13" y="311" width="24" height="7" rx="1" ry="1" fill="#ffffff"/>
  <rect x="16" y="320" width="18" height="9" rx="1" ry="1" fill="#ffffff"/>
  <text x="49" y="316" font-family="Helvetica" font-size="19" fill="#111111">Archived</text>
  <text x="49" y="333" font-family="Helvetica" font-size="13" fill="#888888">14 chats, all muted</text>
  <image x="292" y="311" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>

  <!-- action row: New Folder -->
  <image x="0" y="345" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDivider"/>
  <image x="0" y="371" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <text x="53" y="399" font-family="Helvetica" font-size="16" font-weight="bold" fill="#0779d0">Create New Folder</text>
  <image x="299" y="385" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>

  <text x="160" y="426" font-family="Helvetica" font-size="14" fill="#697487" text-anchor="middle">Swipe a chat right to move it into a folder.</text>

  <!-- tab bar -->
  <image x="0" y="431" width="320" height="49" preserveAspectRatio="none" xlink:href="ASSET:TabBarBackground"/>
  <image x="0" y="431" width="107" height="49" preserveAspectRatio="none" xlink:href="ASSET:TabBarSelected"/>
  <image x="41" y="435" width="24" height="24" xlink:href="ASSET:TabIconMessages_Highlighted"/>
  <text x="53" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Messages</text>
  <image x="56" y="433" width="24" height="20" preserveAspectRatio="none" xlink:href="ASSET:TabBarBadge"/>
  <text x="68" y="447" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
  <image x="148" y="435" width="24" height="24" xlink:href="ASSET:TabIconContacts"/>
  <text x="160" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#999999" text-anchor="middle">Contacts</text>
  <image x="255" y="435" width="24" height="24" xlink:href="ASSET:TabIconSettings"/>
  <text x="267" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#999999" text-anchor="middle">Settings</text>
  </g>
</svg>
