<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">

  <!-- dark linen ground of the login flow -->
  <rect x="0" y="0" width="320" height="480" fill="#1c1e22"/>
  <image x="0" y="0" width="320" height="480" preserveAspectRatio="none" xlink:href="ASSET:LoginShadow"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff">•••••  Telegram</text>
  <text x="147" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff">09:41</text>
  <rect x="286" y="6" width="22" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="14" height="5" fill="#ffffff"/>

  <!-- login navigation bar -->
  <image x="0" y="20" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:LoginHeader"/>
  <image x="0" y="0" width="320" height="8" preserveAspectRatio="none" xlink:href="ASSET:HeaderLoginShadow" opacity="0"/>
  <text x="160" y="50" font-family="Helvetica" font-size="16" font-weight="bold" fill="#25272b" text-anchor="middle">Your Phone</text>
  <text x="160" y="49" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Your Phone</text>

  <image x="5" y="27" width="66" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton_Login"/>
  <text x="38" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#07080a" text-anchor="middle">Options</text>
  <text x="38" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Options</text>

  <image x="263" y="27" width="52" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton_Login_Blue"/>
  <text x="289" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#042651" text-anchor="middle">Next</text>
  <text x="289" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Next</text>

  <!-- notice label, system 14, #c0c5cc, shadow #323c4a at (0,+1) -->
  <text x="160" y="95" font-family="Helvetica" font-size="14" fill="#323c4a" text-anchor="middle">Please confirm your country code and</text>
  <text x="160" y="94" font-family="Helvetica" font-size="14" fill="#c0c5cc" text-anchor="middle">Please confirm your country code and</text>
  <text x="160" y="113" font-family="Helvetica" font-size="14" fill="#323c4a" text-anchor="middle">enter your phone number.</text>
  <text x="160" y="112" font-family="Helvetica" font-size="14" fill="#c0c5cc" text-anchor="middle">enter your phone number.</text>

  <!-- country button, 290 wide, LoginCountry plate -->
  <image x="15" y="134" width="290" height="55" preserveAspectRatio="none" xlink:href="ASSET:LoginCountry"/>
  <text x="29" y="164" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#17191d">United Kingdom</text>
  <text x="29" y="163" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#f0f0f0">United Kingdom</text>
  <image x="272" y="150" width="9" height="15" xlink:href="ASSET:LoginCountryArrow"/>

  <!-- phone input plate, 290 x 47 -->
  <image x="15" y="197" width="290" height="47" preserveAspectRatio="none" xlink:href="ASSET:LoginInput"/>
  <image x="75" y="198" width="1" height="48" preserveAspectRatio="none" xlink:href="ASSET:LoginInputDivider"/>
  <text x="46" y="225" font-family="Helvetica" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">+44</text>
  <text x="89" y="225" font-family="Helvetica" font-size="18" font-weight="bold" fill="#a0a5ad">Phone number</text>

  <!-- dimming behind the action sheet -->
  <rect x="0" y="0" width="320" height="480" fill="#000000" opacity="0.4"/>

  <!-- TGActionSheet: two 41pt buttons + Cancel -->
  <image x="8" y="341" width="10" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonLeft"/>
  <image x="18" y="341" width="284" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonCenter"/>
  <image x="302" y="341" width="10" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonRight"/>
  <text x="160" y="368" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.5">Log in by QR Code</text>
  <text x="160" y="367" font-family="Helvetica" font-size="17" font-weight="bold" fill="#16181a" text-anchor="middle">Log in by QR Code</text>

  <image x="8" y="382" width="304" height="1" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonSeparator"/>

  <image x="8" y="383" width="10" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonLeft"/>
  <image x="18" y="383" width="284" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonCenter"/>
  <image x="302" y="383" width="10" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonRight"/>
  <text x="160" y="410" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.5">Log in with Email</text>
  <text x="160" y="409" font-family="Helvetica" font-size="17" font-weight="bold" fill="#16181a" text-anchor="middle">Log in with Email</text>

  <image x="8" y="431" width="10" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonLeft"/>
  <image x="18" y="431" width="284" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonCenter"/>
  <image x="302" y="431" width="10" height="41" preserveAspectRatio="none" xlink:href="ASSET:MenuButtonRight"/>
  <text x="160" y="458" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.5">Cancel</text>
  <text x="160" y="457" font-family="Helvetica" font-size="17" font-weight="bold" fill="#16181a" text-anchor="middle">Cancel</text>

  </g>
</svg>
