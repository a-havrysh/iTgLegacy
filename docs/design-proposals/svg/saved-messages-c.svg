<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
    <g id="star">
      <polygon points="0,-7 1.76,-2.43 6.66,-2.16 2.85,0.93 4.11,5.66 0,3 -4.11,5.66 -2.85,0.93 -6.66,-2.16 -1.76,-2.43"/>
    </g>
    <g id="pin">
      <circle cx="0" cy="-2" r="4.5"/>
      <rect x="-1" y="1" width="2" height="6"/>
    </g>
    <g id="book">
      <rect x="-5.5" y="-6" width="11" height="12" rx="1.5" ry="1.5"/>
    </g>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="45" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="257" y="27" width="58" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="286" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chat</text>
  <text x="158" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Saved Messages</text>

  <!-- search bar, 44pt -->
  <image x="0" y="64" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:SearchBarBackground"/>
  <image x="8" y="70" width="304" height="32" preserveAspectRatio="none" xlink:href="ASSET:SearchInputField"/>
  <image x="17" y="78" width="15" height="16" xlink:href="ASSET:SearchBarIcon"/>
  <text x="38" y="91" font-family="Helvetica" font-size="16" fill="#8d9298">Search saved messages</text>

  <!-- section header: Ideas -->
  <image x="0" y="108" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDividerFirst"/>
  <use xlink:href="#star" transform="translate(17,121)" fill="#e09602"/>
  <text x="30" y="126" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">Ideas</text>
  <text x="310" y="126" font-family="Helvetica" font-size="13" fill="#697487" text-anchor="end">14</text>

  <!-- row 1 -->
  <rect x="0" y="134" width="320" height="73" fill="#ffffff"/>
  <rect x="0" y="206.5" width="320" height="0.5" fill="#d5dee5"/>
  <rect x="8" y="142" width="56" height="56" rx="5" ry="5" fill="#41a903"/>
  <text x="36" y="179" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <image x="73" y="152" width="12" height="12" xlink:href="ASSET:DialogListGroupChatIcon"/>
  <text x="89" y="163" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Design Team</text>
  <text x="303" y="161" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Mon</text>
  <text x="73" y="182" font-family="Helvetica" font-size="14" fill="#888888">the type scale is frozen: 19 / 17 /</text>
  <text x="73" y="198" font-family="Helvetica" font-size="14" fill="#888888">16 / 15 / 14 / 13 / 12 / 11</text>

  <!-- row 2 -->
  <rect x="0" y="207" width="320" height="73" fill="#ffffff"/>
  <rect x="0" y="279.5" width="320" height="0.5" fill="#d5dee5"/>
  <rect x="8" y="215" width="56" height="56" rx="5" ry="5" fill="#0f94ed"/>
  <text x="36" y="252" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">MN</text>
  <text x="73" y="236" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">My Notes</text>
  <text x="303" y="234" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">9 Aug</text>
  <text x="73" y="255" font-family="Helvetica" font-size="14" fill="#888888">a legacy client should look like</text>
  <text x="73" y="271" font-family="Helvetica" font-size="14" fill="#888888">the year it came from</text>

  <!-- section header: To read -->
  <image x="0" y="280" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDivider"/>
  <use xlink:href="#pin" transform="translate(17,120) translate(0,180)" fill="#ee4928"/>
  <text x="30" y="298" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">To read</text>
  <text x="310" y="298" font-family="Helvetica" font-size="13" fill="#697487" text-anchor="end">6</text>

  <!-- row 3 -->
  <rect x="0" y="306" width="320" height="73" fill="#ffffff"/>
  <rect x="0" y="378.5" width="320" height="0.5" fill="#d5dee5"/>
  <rect x="8" y="314" width="56" height="56" rx="5" ry="5" fill="#ee4928"/>
  <text x="36" y="351" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AK</text>
  <text x="73" y="335" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Alice Kovalenko</text>
  <text x="303" y="333" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">14:02</text>
  <text x="73" y="354" font-family="Helvetica" font-size="14" fill="#888888">deploy checklist lives in the wiki</text>
  <text x="73" y="370" font-family="Helvetica" font-size="14" fill="#888888">under Release/2014</text>

  <!-- section header: Work -->
  <image x="0" y="379" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDivider"/>
  <use xlink:href="#book" transform="translate(17,392)" fill="#0f94ed"/>
  <text x="30" y="397" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">Work</text>
  <text x="310" y="397" font-family="Helvetica" font-size="13" fill="#697487" text-anchor="end">22</text>

  <!-- row 4 -->
  <rect x="0" y="405" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="413" width="56" height="56" rx="5" ry="5" fill="#e09602"/>
  <text x="36" y="450" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">PK</text>
  <text x="73" y="434" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Pavel Kuznetsov</text>
  <text x="303" y="432" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">9 Aug</text>
  <text x="73" y="453" font-family="Helvetica" font-size="14" fill="#536c8c">Document, 2.4 MB</text>
  <text x="73" y="469" font-family="Helvetica" font-size="14" fill="#888888">invoice-august.pdf</text>
  </g>
</svg>
