<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="52" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="31" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit</text>
  <image x="279" y="27" width="36" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <image x="288" y="34" width="18" height="16" xlink:href="ASSET:ComposeMessageIcon"/>
  <text x="160" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>

  <!-- folder strip: 36pt scope bar, SearchBarBackground ground, SearchBarScopeButton art -->
  <image x="0" y="64" width="320" height="36" preserveAspectRatio="none" xlink:href="ASSET:SearchBarBackground"/>
  <rect x="0" y="99.5" width="320" height="0.5" fill="#d5dee5"/>
  <image x="6" y="67" width="52" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="32" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">All</text>
  <image x="62" y="67" width="86" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="97" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">Unread</text>
  <image x="126" y="71" width="18" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="135" y="86" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <image x="152" y="67" width="80" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="184" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Work</text>
  <image x="210" y="71" width="18" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="219" y="86" font-family="Helvetica" font-size="14" font-weight="bold" fill="#2371c2" text-anchor="middle">4</text>
  <image x="236" y="67" width="70" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="271" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">Family</text>
  <image x="310" y="67" width="26" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>

  <!-- row 1, unread -->
  <rect x="0" y="100" width="320" height="73" fill="#ebf0f5"/>
  <rect x="8" y="108" width="56" height="56" rx="5" ry="5" fill="#0f94ed"/>
  <text x="36" y="144" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <image x="73" y="112" width="13" height="13" xlink:href="ASSET:DialogListGroupChatIcon"/>
  <text x="90" y="124" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Design Team</text>
  <text x="245" y="124" font-family="Helvetica" font-size="13" fill="#337acc">2:14 PM</text>
  <text x="73" y="143" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Maria:</text>
  <text x="115" y="143" font-family="Helvetica" font-size="14" fill="#5b646e">can you check the new cell</text>
  <text x="73" y="159" font-family="Helvetica" font-size="14" fill="#5b646e">spacing before the build?</text>
  <image x="265" y="129" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="278" y="144" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="0" y="172.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row 2 -->
  <rect x="0" y="173" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="181" width="56" height="56" rx="5" ry="5" fill="#ee4928"/>
  <text x="36" y="217" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AK</text>
  <text x="73" y="197" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Alexey Kudrin</text>
  <text x="253" y="197" font-family="Helvetica" font-size="13" fill="#337acc">1:02 PM</text>
  <image x="233" y="187" width="18" height="11" xlink:href="ASSET:DialogListRead"/>
  <text x="73" y="216" font-family="Helvetica" font-size="14" fill="#888888">Sounds good, I&#8217;ll push the</text>
  <text x="73" y="232" font-family="Helvetica" font-size="14" fill="#888888">branch tonight.</text>
  <rect x="0" y="245.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row 3, muted -->
  <rect x="0" y="246" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="254" width="56" height="56" rx="5" ry="5" fill="#41a903"/>
  <text x="36" y="290" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">SP</text>
  <image x="73" y="258" width="13" height="13" xlink:href="ASSET:DialogListGroupChatIcon"/>
  <text x="90" y="270" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Sales Planning</text>
  <image x="187" y="264" width="12" height="12" xlink:href="ASSET:DialogList_Muted"/>
  <text x="248" y="270" font-family="Helvetica" font-size="13" fill="#337acc">Yesterday</text>
  <text x="73" y="289" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Ivan:</text>
  <text x="106" y="289" font-family="Helvetica" font-size="14" fill="#536c8c">Photo</text>
  <image x="265" y="275" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="278" y="290" font-family="Helvetica" font-size="14" font-weight="bold" fill="#a8b4c2" text-anchor="middle">2</text>
  <rect x="0" y="318.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row 4 -->
  <rect x="0" y="319" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="327" width="56" height="56" rx="5" ry="5" fill="#8f3bf7"/>
  <text x="36" y="363" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">NP</text>
  <text x="73" y="343" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Nina Petrova</text>
  <text x="257" y="343" font-family="Helvetica" font-size="13" fill="#337acc">Tuesday</text>
  <image x="242" y="333" width="13" height="11" xlink:href="ASSET:DialogListSent"/>
  <text x="73" y="362" font-family="Helvetica" font-size="14" fill="#888888">Deck is on the shared drive</text>
  <rect x="0" y="391.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row 5, partly under the tab bar -->
  <rect x="0" y="392" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="400" width="56" height="56" rx="5" ry="5" fill="#e09602"/>
  <text x="36" y="436" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">RK</text>
  <text x="73" y="416" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Roman Kim</text>

  <!-- tab bar -->
  <image x="0" y="431" width="320" height="49" preserveAspectRatio="none" xlink:href="ASSET:TabBarBackground"/>
  <image x="0" y="431" width="107" height="49" preserveAspectRatio="none" xlink:href="ASSET:TabBarSelected"/>
  <image x="41" y="435" width="24" height="24" xlink:href="ASSET:TabIconMessages_Highlighted"/>
  <text x="53" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Messages</text>
  <image x="56" y="433" width="24" height="20" preserveAspectRatio="none" xlink:href="ASSET:TabBarBadge"/>
  <text x="68" y="447" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
  <image x="148" y="435" width="24" height="24" xlink:href="ASSET:TabIconContacts"/>
  <text x="160" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#999999" text-anchor="middle">Contacts</text>
  <image x="255" y="435" width="24" height="24" xlink:href="ASSET:TabIconSettings"/>
  <text x="267" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#999999" text-anchor="middle">Settings</text>
  </g>
</svg>
