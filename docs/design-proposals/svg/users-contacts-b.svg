<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="rowg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="hdrAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2fe"/>
      <stop offset="1" stop-color="#e6e2f0"/>
    </linearGradient>
    <g id="chev">
      <path d="M0 0 L5 5 L0 10" fill="none" stroke="#9aa4b0" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#c8ccd1"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">•••••  Telegram</text>
  <text x="146" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">14:26</text>
  <rect x="286" y="6" width="22" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="15" height="5" fill="#ffffff"/>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <rect x="0" y="63" width="320" height="1" fill="#2f4d70"/>
  <image x="5" y="27" width="62" height="30" xlink:href="ASSET:BackButton"/>
  <text x="34" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Chat</text>
  <text x="160" y="49" font-family="Helvetica" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">Info</text>
  <image x="266" y="27" width="49" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="290" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Edit</text>

  <!-- identity header, 118 pt, accent-tinted ground + 3pt accent rule -->
  <rect x="0" y="64" width="320" height="118" fill="url(#hdrAccent)"/>
  <rect x="0" y="179" width="320" height="3" fill="#8f3bf7"/>
  <rect x="9" y="78" width="70" height="70" rx="10" fill="#8f3bf7"/>
  <text x="44" y="126" font-family="Helvetica" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">AP</text>

  <text x="94" y="105" font-family="Helvetica" font-weight="bold" font-size="19" fill="#eef1f6">Anna Petrova</text>
  <text x="94" y="104" font-family="Helvetica" font-weight="bold" font-size="19" fill="#222932">Anna Petrova</text>
  <path d="M216 91 l3 4 l5 -8 l3 2 l-8 12 l-6 -7 z" fill="#0e7acd"/>
  <text x="94" y="125" font-family="Helvetica" font-size="14" fill="#eef1f6">last seen 5 minutes ago</text>
  <text x="94" y="124" font-family="Helvetica" font-size="14" fill="#6d7d90">last seen 5 minutes ago</text>

  <!-- identity chip row, 22 pt tall, x94, 4 pt gutter -->
  <image x="94" y="134" width="82" height="22" xlink:href="ASSET:GroupedActionButton"/>
  <text x="102" y="149" font-family="Helvetica" font-size="13">🎄</text>
  <text x="118" y="149" font-family="Helvetica" font-weight="bold" font-size="13" fill="#506e8d">until 22:00</text>

  <image x="180" y="134" width="88" height="22" xlink:href="ASSET:GroupedActionButton"/>
  <text x="188" y="149" font-family="Helvetica" font-size="13">🎂</text>
  <text x="204" y="149" font-family="Helvetica" font-weight="bold" font-size="13" fill="#506e8d">11 February</text>

  <text x="94" y="172" font-family="Helvetica" font-size="13" fill="#dfe4ea">Photographer. Moscow &#8594; Lisbon.</text>
  <text x="94" y="171" font-family="Helvetica" font-size="13" fill="#697487">Photographer. Moscow &#8594; Lisbon.</text>

  <!-- group 1 -->
  <rect x="10" y="194" width="300" height="88" rx="8" fill="url(#rowg)" stroke="#a9b0b7" stroke-width="1"/>
  <line x1="10" y1="238" x2="310" y2="238" stroke="#cfd4d9" stroke-width="1"/>
  <text x="20" y="222" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">mobile</text>
  <text x="300" y="222" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">+7 916 145 22 08</text>
  <text x="20" y="266" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">username</text>
  <text x="300" y="266" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">@annapetrova</text>

  <!-- group 2: personal channel row -->
  <rect x="10" y="296" width="300" height="44" rx="8" fill="url(#rowg)" stroke="#a9b0b7" stroke-width="1"/>
  <rect x="18" y="304" width="28" height="28" rx="3" fill="#41a903"/>
  <text x="32" y="324" font-family="Helvetica" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">P</text>
  <text x="54" y="320" font-family="Helvetica" font-weight="bold" font-size="17" fill="#0779d0">Petrova Photo</text>
  <text x="288" y="320" font-family="Helvetica" font-size="14" fill="#888888" text-anchor="end">channel</text>
  <use xlink:href="#chev" x="296" y="313"/>

  <!-- group 3 -->
  <rect x="10" y="354" width="300" height="88" rx="8" fill="url(#rowg)" stroke="#a9b0b7" stroke-width="1"/>
  <line x1="10" y1="398" x2="310" y2="398" stroke="#cfd4d9" stroke-width="1"/>
  <text x="20" y="382" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">Notifications</text>
  <text x="300" y="382" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">On</text>
  <text x="20" y="426" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">Shared Media</text>
  <text x="288" y="426" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">412</text>
  <use xlink:href="#chev" x="296" y="411"/>

  <image x="10" y="452" width="300" height="44" xlink:href="ASSET:GroupedActionButton"/>
  <text x="160" y="474" font-family="Helvetica" font-weight="bold" font-size="16" fill="#0779d0" text-anchor="middle">Block user</text>
</svg>
