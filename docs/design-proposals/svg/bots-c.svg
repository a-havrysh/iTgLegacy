<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/><stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <pattern id="ground" patternUnits="userSpaceOnUse" width="64" height="64">
      <image x="0" y="0" width="64" height="64" xlink:href="ASSET:SettingsBackground"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="url(#ground)"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">●●●●● Telegram</text>
  <text x="152" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">9:41</text>
  <text x="286" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">100%</text>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="70" height="30" xlink:href="ASSET:BackButton"/>
  <text x="32" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">GitHub Bot</text>
  <text x="160" y="49" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bot</text>
  <rect x="0" y="63" width="320" height="1" fill="#2f4a6b"/>

  <!-- profile-style header, 86pt: avatar (9,14,70,70), text column x = 94 -->
  <rect x="0" y="64" width="320" height="86" fill="#ffffff" opacity="0.55"/>
  <rect x="9" y="78" width="70" height="70" rx="10" fill="#0f94ed"/>
  <text x="44" y="126" font-family="Helvetica" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">G</text>
  <text x="94" y="106" font-family="Helvetica" font-size="19" font-weight="bold" fill="#222932">GitHub Bot</text>
  <text x="94" y="128" font-family="Helvetica" font-size="14" fill="#6d7d90">@githubbot · bot</text>
  <rect x="0" y="149" width="320" height="1" fill="#d5dee5"/>

  <!-- bot short description as a comment block -->
  <text x="14" y="168" font-family="Helvetica" font-size="14" fill="#697487">Watch repositories, get issue and</text>
  <text x="14" y="184" font-family="Helvetica" font-size="14" fill="#697487">release notifications in Telegram.</text>

  <!-- COMMANDS section -->
  <text x="14" y="206" font-family="Helvetica" font-size="14" fill="#697487">Commands</text>
  <image x="0" y="212" width="320" height="44" xlink:href="ASSET:Cell102" preserveAspectRatio="none"/>
  <text x="10" y="232" font-family="Helvetica" font-size="17" font-weight="bold" fill="#516691">/watch</text>
  <text x="310" y="232" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">subscribe to a repo</text>
  <rect x="0" y="255" width="320" height="1" fill="#d5dee5"/>

  <image x="0" y="256" width="320" height="44" xlink:href="ASSET:Cell102" preserveAspectRatio="none"/>
  <text x="10" y="276" font-family="Helvetica" font-size="17" font-weight="bold" fill="#516691">/list</text>
  <text x="310" y="276" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">my subscriptions</text>
  <rect x="0" y="299" width="320" height="1" fill="#d5dee5"/>

  <image x="0" y="300" width="320" height="44" xlink:href="ASSET:Cell102" preserveAspectRatio="none"/>
  <text x="10" y="320" font-family="Helvetica" font-size="17" font-weight="bold" fill="#516691">/settings</text>
  <text x="310" y="320" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">notifications</text>

  <!-- MINI APP section: the reduced web app -->
  <text x="14" y="365" font-family="Helvetica" font-size="14" fill="#697487">Mini app</text>
  <image x="0" y="371" width="320" height="52" xlink:href="ASSET:Cell102" preserveAspectRatio="none"/>
  <rect x="10" y="379" width="36" height="36" rx="4" fill="#41a903"/>
  <path d="M20 397 h16 M28 389 v16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="54" y="393" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Repo Dashboard</text>
  <text x="54" y="410" font-family="Helvetica" font-size="13" fill="#888888">Cannot run on this device</text>
  <rect x="0" y="422" width="320" height="1" fill="#d5dee5"/>

  <!-- neutral action: hand the URL to Safari instead of hosting it -->
  <image x="8" y="428" width="150" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <text x="83" y="455" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Open in Safari</text>
  <image x="162" y="428" width="150" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <text x="237" y="455" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Copy link</text>
</svg>
