<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">14:32</text>
  <text x="303" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">78%</text>

  <!-- navigation bar -->
  <image x="0" y="20" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:NavBarBackground"/>
  <image x="5" y="27" width="46" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="28" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit</text>
  <text x="160" y="49" font-family="Helvetica" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="283" y="26" width="32" height="32" xlink:href="ASSET:ComposeMessageIcon"/>

  <!-- story tray, 82pt, sticky strip colour -->
  <rect x="0" y="64" width="320" height="82" fill="#e4e9f0"/>
  <rect x="0" y="145" width="320" height="1" fill="#d5dee5"/>

  <!-- my story -->
  <rect x="8" y="70" width="56" height="56" rx="5" ry="5" fill="#dfe4eb" stroke="#c3cbd6" stroke-width="1"/>
  <text x="36" y="106" font-family="Helvetica" font-size="30" font-weight="bold" fill="#8b97a5" text-anchor="middle">+</text>
  <text x="36" y="140" font-family="Helvetica" font-size="11" fill="#697487" text-anchor="middle">My Story</text>

  <!-- Alena, unread -->
  <rect x="74" y="68" width="60" height="60" rx="7" ry="7" fill="none" stroke="#0779d0" stroke-width="2"/>
  <rect x="76" y="70" width="56" height="56" rx="5" ry="5" fill="#ee4928"/>
  <text x="104" y="107" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">AG</text>
  <text x="104" y="140" font-family="Helvetica" font-size="11" fill="#111111" text-anchor="middle">Alena</text>

  <!-- Dmitri, unread -->
  <rect x="142" y="68" width="60" height="60" rx="7" ry="7" fill="none" stroke="#0779d0" stroke-width="2"/>
  <rect x="144" y="70" width="56" height="56" rx="5" ry="5" fill="#41a903"/>
  <text x="172" y="107" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">DI</text>
  <text x="172" y="140" font-family="Helvetica" font-size="11" fill="#111111" text-anchor="middle">Dmitri</text>

  <!-- Katya, already read -->
  <rect x="210" y="68" width="60" height="60" rx="7" ry="7" fill="none" stroke="#c3cbd6" stroke-width="2"/>
  <rect x="212" y="70" width="56" height="56" rx="5" ry="5" fill="#e09602"/>
  <text x="240" y="107" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">KP</text>
  <text x="240" y="140" font-family="Helvetica" font-size="11" fill="#888888" text-anchor="middle">Katya</text>

  <!-- next poster, clipped: the strip scrolls sideways -->
  <rect x="278" y="68" width="60" height="60" rx="7" ry="7" fill="none" stroke="#c3cbd6" stroke-width="2"/>
  <rect x="280" y="70" width="56" height="56" rx="5" ry="5" fill="#0f94ed"/>
  <text x="304" y="107" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">TT</text>

  <!-- chat list rows, 73pt each -->
  <image x="0" y="146" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="154" width="56" height="56" rx="5" ry="5" fill="#ee4928"/>
  <text x="36" y="191" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">AG</text>
  <text x="73" y="172" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Alena Grishko</text>
  <text x="311" y="167" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">14:12</text>
  <text x="73" y="192" font-family="Helvetica" font-size="14" fill="#5b646e">Are we still on for Thursday?</text>
  <image x="265" y="175" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="278" y="190" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <image x="0" y="219" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="227" width="56" height="56" rx="5" ry="5" fill="#8f3bf7"/>
  <image x="20" y="239" width="32" height="32" xlink:href="ASSET:DialogListGroupChatIcon"/>
  <text x="73" y="245" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Weekend Trip</text>
  <text x="311" y="240" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">13:40</text>
  <text x="73" y="265" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Pavel:<tspan font-weight="normal" fill="#888888"> booked the second car</tspan></text>

  <image x="0" y="292" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="300" width="56" height="56" rx="5" ry="5" fill="#41a903"/>
  <text x="36" y="337" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">DI</text>
  <text x="73" y="318" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Dmitri Ivanov</text>
  <text x="311" y="313" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Yest.</text>
  <image x="284" y="322" width="18" height="11" xlink:href="ASSET:DialogListRead"/>
  <text x="73" y="338" font-family="Helvetica" font-size="14" fill="#536c8c">Photo</text>

  <image x="0" y="365" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="373" width="56" height="56" rx="5" ry="5" fill="#00a1c4"/>
  <text x="36" y="410" font-family="Helvetica" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">TT</text>
  <text x="73" y="391" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Telegram Tips</text>
  <text x="311" y="386" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Mon</text>
  <text x="73" y="411" font-family="Helvetica" font-size="14" fill="#888888">Five things you did not know</text>

  <!-- tab bar -->
  <image x="0" y="431" width="320" height="49" preserveAspectRatio="none" xlink:href="ASSET:TabBarBackground"/>
  <image x="0" y="431" width="107" height="49" preserveAspectRatio="none" xlink:href="ASSET:TabBarSelected"/>
  <image x="37" y="435" width="32" height="28" xlink:href="ASSET:TabIconMessages"/>
  <text x="53" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="144" y="435" width="32" height="28" xlink:href="ASSET:TabIconContacts"/>
  <text x="160" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#999999" text-anchor="middle">Contacts</text>
  <image x="251" y="435" width="32" height="28" xlink:href="ASSET:TabIconSettings"/>
  <text x="267" y="474" font-family="Helvetica" font-size="10" font-weight="bold" fill="#999999" text-anchor="middle">Settings</text>
</svg>
