<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="scopebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d92bd"/>
      <stop offset="1" stop-color="#4a6e97"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#e4e9f0"/>
    </linearGradient>
    <g id="pause">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#d5dee5" stroke-width="2"/>
      <path d="M0 -14 A14 14 0 0 1 12 7" fill="none" stroke="#0779d0" stroke-width="2"/>
      <rect x="-4" y="-4" width="3" height="8" fill="#0779d0"/>
      <rect x="1" y="-4" width="3" height="8" fill="#0779d0"/>
    </g>
    <g id="resume">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#d5dee5" stroke-width="2"/>
      <path d="M0 -14 A14 14 0 0 1 9.9 -9.9" fill="none" stroke="#8b97a5" stroke-width="2"/>
      <path d="M-3 -5 L5 0 L-3 5 Z" fill="#8b97a5"/>
    </g>
    <g id="chev">
      <path d="M0 0 L5 5 L0 10" fill="none" stroke="#9aa4b0" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">•••••  Telegram</text>
  <text x="146" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">14:26</text>
  <rect x="286" y="6" width="22" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="15" height="5" fill="#ffffff"/>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="56" height="30" xlink:href="ASSET:BackButton"/>
  <text x="31" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Info</text>
  <text x="160" y="49" font-family="Helvetica" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">Shared Media</text>
  <image x="256" y="27" width="59" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="285" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Clear</text>

  <!-- 44pt scope strip -->
  <rect x="0" y="64" width="320" height="44" fill="url(#scopebg)"/>
  <rect x="0" y="107" width="320" height="1" fill="#2f4d70"/>
  <image x="5" y="71" width="77" height="30" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="43" y="90" font-family="Helvetica" font-weight="bold" font-size="12" fill="#5c708b" text-anchor="middle">Media</text>
  <image x="83" y="71" width="77" height="30" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="121" y="90" font-family="Helvetica" font-weight="bold" font-size="12" fill="#5c708b" text-anchor="middle">Files</text>
  <image x="161" y="71" width="77" height="30" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="199" y="90" font-family="Helvetica" font-weight="bold" font-size="12" fill="#5c708b" text-anchor="middle">Links</text>
  <image x="239" y="71" width="77" height="30" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="277" y="90" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Downloads</text>

  <!-- section header : Downloading -->
  <rect x="0" y="108" width="320" height="25" fill="url(#hdr)"/>
  <rect x="0" y="132" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="126" font-family="Helvetica" font-weight="bold" font-size="15" fill="#ffffff">DOWNLOADING</text>
  <text x="10" y="125" font-family="Helvetica" font-weight="bold" font-size="15" fill="#697487">DOWNLOADING</text>

  <!-- row 1 : 51pt at y 133 -->
  <image x="0" y="133" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <image x="5" y="138" width="40" height="40" xlink:href="ASSET:filetype_icon_mp4-island"/>
  <text x="49" y="152" font-family="Helvetica" font-weight="bold" font-size="15" fill="#111111">Trip to Lviv.mp4</text>
  <text x="49" y="168" font-family="Helvetica" font-size="13" fill="#888888">Anna Sokolova · 4.1 MB of 8.7 MB</text>
  <rect x="49" y="173" width="223" height="2" fill="#d5dee5"/>
  <rect x="49" y="173" width="105" height="2" fill="#0779d0"/>
  <use xlink:href="#pause" x="292" y="158"/>

  <!-- row 2 : y 184 -->
  <image x="0" y="184" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <image x="5" y="189" width="40" height="40" xlink:href="ASSET:filetype_icon_pdf-island"/>
  <text x="49" y="203" font-family="Helvetica" font-weight="bold" font-size="15" fill="#111111">Contract_final.pdf</text>
  <text x="49" y="219" font-family="Helvetica" font-size="13" fill="#888888">Design Team · paused at 0.7 MB of 2.4 MB</text>
  <rect x="49" y="224" width="223" height="2" fill="#d5dee5"/>
  <rect x="49" y="224" width="65" height="2" fill="#8b97a5"/>
  <use xlink:href="#resume" x="292" y="209"/>

  <!-- row 3 : y 235 -->
  <image x="0" y="235" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <image x="5" y="240" width="40" height="40" xlink:href="ASSET:filetype_icon_mp3-island"/>
  <text x="49" y="254" font-family="Helvetica" font-weight="bold" font-size="15" fill="#111111">Kyiv set — live.mp3</text>
  <text x="49" y="270" font-family="Helvetica" font-size="13" fill="#888888">Music Chat · 6.8 MB of 9.0 MB · 210 KB/s</text>
  <rect x="49" y="275" width="223" height="2" fill="#d5dee5"/>
  <rect x="49" y="275" width="168" height="2" fill="#0779d0"/>
  <use xlink:href="#pause" x="292" y="260"/>

  <!-- section header : Completed -->
  <rect x="0" y="286" width="320" height="25" fill="url(#hdr)"/>
  <rect x="0" y="285" width="320" height="1" fill="#d5dee5"/>
  <rect x="0" y="310" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="304" font-family="Helvetica" font-weight="bold" font-size="15" fill="#ffffff">COMPLETED</text>
  <text x="10" y="303" font-family="Helvetica" font-weight="bold" font-size="15" fill="#697487">COMPLETED</text>
  <text x="310" y="303" font-family="Helvetica" font-size="13" fill="#0779d0" text-anchor="end">Clear All</text>

  <!-- row 4 : y 311 -->
  <image x="0" y="311" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <image x="5" y="316" width="40" height="40" xlink:href="ASSET:filetype_icon_zip-island"/>
  <text x="49" y="330" font-family="Helvetica" font-weight="bold" font-size="15" fill="#111111">assets_v3.zip</text>
  <text x="49" y="346" font-family="Helvetica" font-size="13" fill="#888888">Design Team · 12.4 MB · yesterday</text>
  <use xlink:href="#chev" x="299" y="331"/>

  <!-- row 5 : y 362 -->
  <image x="0" y="362" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <image x="5" y="367" width="40" height="40" xlink:href="ASSET:filetype_icon_doc-island"/>
  <text x="49" y="381" font-family="Helvetica" font-weight="bold" font-size="15" fill="#111111">Notes on the release.doc</text>
  <text x="49" y="397" font-family="Helvetica" font-size="13" fill="#888888">Pavel Orlov · 88 KB · Mon</text>
  <use xlink:href="#chev" x="299" y="382"/>

  <!-- row 6 : y 413 -->
  <image x="0" y="413" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <image x="5" y="418" width="40" height="40" xlink:href="ASSET:filetype_icon_jpg-island"/>
  <text x="49" y="432" font-family="Helvetica" font-weight="bold" font-size="15" fill="#111111">IMG_2841.jpg</text>
  <text x="49" y="448" font-family="Helvetica" font-size="13" fill="#888888">Anna Sokolova · 1.9 MB · Mon</text>
  <use xlink:href="#chev" x="299" y="433"/>

  <!-- footer / storage caption -->
  <text x="10" y="475" font-family="Helvetica" font-size="14" fill="#dae0e8">Downloads use 24.6 MB of storage.</text>
  <text x="10" y="474" font-family="Helvetica" font-size="14" fill="#697487">Downloads use 24.6 MB of storage.</text>
</svg>
