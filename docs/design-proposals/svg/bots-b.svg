<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/><stop offset="1" stop-color="#42678f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">●●●●● Telegram</text>
  <text x="152" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">9:41</text>
  <text x="286" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">100%</text>

  <!-- nav bar: modal form, Cancel on the left -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="52" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="31" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancel</text>
  <text x="160" y="43" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">@pic</text>
  <text x="160" y="56" font-family="Helvetica" font-size="11" fill="#c9dcf2" text-anchor="middle">Image Search Bot</text>
  <rect x="0" y="63" width="320" height="1" fill="#2f4a6b"/>

  <!-- search bar, 44pt -->
  <image x="0" y="64" width="320" height="44" xlink:href="ASSET:SearchBarBackground"/>
  <image x="8" y="71" width="304" height="30" xlink:href="ASSET:SearchInputField"/>
  <image x="16" y="79" width="14" height="14" xlink:href="ASSET:SearchBarIcon"/>
  <text x="36" y="91" font-family="Helvetica" font-size="14" fill="#111111">mountain sunrise</text>
  <image x="290" y="79" width="14" height="14" xlink:href="ASSET:ClearInput"/>

  <!-- switch-pm header row, 44pt -->
  <rect x="0" y="108" width="320" height="44" fill="#f2f5f8"/>
  <rect x="0" y="151" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="130" font-family="Helvetica" font-size="16" fill="#0779d0">Switch to private chat</text>
  <text x="10" y="145" font-family="Helvetica" font-size="13" fill="#888888">Sign in to see your own uploads</text>

  <!-- results: 51pt Cell102 rows -->
  <image x="0" y="152" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="157" width="40" height="40" rx="4" fill="#5a7fa6"/>
  <path d="M5 187 l12 -14 l9 10 l7 -8 l12 12 v10 h-40 z" fill="#3d5f83"/>
  <circle cx="36" cy="166" r="4" fill="#f2d16b"/>
  <text x="49" y="176" font-family="Helvetica" font-size="19" fill="#111111">Sunrise over Kazbek</text>
  <text x="50" y="192" font-family="Helvetica" font-size="13" fill="#888888">1600 × 1067 · unsplash.com</text>

  <image x="0" y="203" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="208" width="40" height="40" rx="4" fill="#7d6a55"/>
  <path d="M5 238 l14 -16 l10 12 l6 -6 l10 10 v10 h-40 z" fill="#5c4c3b"/>
  <text x="49" y="227" font-family="Helvetica" font-size="19" fill="#111111">Dolomites, blue hour</text>
  <text x="50" y="243" font-family="Helvetica" font-size="13" fill="#888888">2048 × 1365 · flickr.com</text>

  <image x="0" y="254" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="259" width="40" height="40" rx="4" fill="#4c6f5a"/>
  <path d="M5 289 l11 -12 l8 9 l8 -9 l13 12 v10 h-40 z" fill="#365243"/>
  <text x="49" y="278" font-family="Helvetica" font-size="19" fill="#111111">Fog in the valley</text>
  <text x="50" y="294" font-family="Helvetica" font-size="13" fill="#888888">1280 × 853 · unsplash.com</text>

  <image x="0" y="305" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="310" width="40" height="40" rx="4" fill="#6a5f8f"/>
  <path d="M5 340 l13 -15 l9 11 l7 -7 l11 11 v10 h-40 z" fill="#4c4370"/>
  <text x="49" y="329" font-family="Helvetica" font-size="19" fill="#111111">Alpine ridge at dawn</text>
  <text x="50" y="345" font-family="Helvetica" font-size="13" fill="#888888">1920 × 1280 · pexels.com</text>

  <image x="0" y="356" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="361" width="40" height="40" rx="4" fill="#8f6a4c"/>
  <path d="M5 391 l12 -13 l10 10 l6 -6 l12 11 v10 h-40 z" fill="#6d4f38"/>
  <text x="49" y="380" font-family="Helvetica" font-size="19" fill="#111111">Desert morning</text>
  <text x="50" y="396" font-family="Helvetica" font-size="13" fill="#888888">1500 × 1000 · unsplash.com</text>

  <!-- paging row: next_offset fetch in flight, 51pt -->
  <image x="0" y="407" width="320" height="51" xlink:href="ASSET:Cell102"/>
  <g transform="translate(112,423)">
    <circle cx="9" cy="9" r="7.5" fill="none" stroke="#c2c9d1" stroke-width="2"/>
    <path d="M9 1.5 a7.5 7.5 0 0 1 7.5 7.5" fill="none" stroke="#7d8794" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="140" y="437" font-family="Helvetica" font-size="14" fill="#888888">Loading more…</text>

  <!-- closing footer plate -->
  <image x="0" y="458" width="320" height="22" xlink:href="ASSET:Footer"/>
</svg>
