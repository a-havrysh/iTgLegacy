<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9:41 AM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">100%</text>

  <rect x="0" y="20" width="320" height="44" fill="url(#bar)"/>
  <image x="5" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="41" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="266" y="27" width="49" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="290" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">New</text>
  <text x="160" y="41" font-family="Helvetica" font-size="16" font-weight="bold" fill="#3d5c81" text-anchor="middle">iOS Developers</text>
  <text x="160" y="40" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">iOS Developers</text>
  <text x="160" y="57" font-family="Helvetica" font-size="13" fill="#c9dcf2" text-anchor="middle">24 topics</text>

  <!-- row 1: General, pinned -->
  <image x="0" y="64" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="0" y="64" width="320" height="72" fill="#ebf0f5"/>
  <rect x="8" y="72" width="56" height="56" rx="5" ry="5" fill="#0f94ed"/>
  <text x="36" y="110" font-family="Helvetica" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">#</text>
  <text x="73" y="87" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">General</text>
  <text x="311" y="87" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">9:32</text>
  <text x="73" y="107" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Anna:</text>
  <text x="107" y="107" font-family="Helvetica" font-size="14" fill="#5b646e">morning everyone, standup in ten</text>
  <text x="73" y="123" font-family="Helvetica" font-size="14" fill="#5b646e">minutes please</text>
  <image x="280" y="93" width="32" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="296" y="109" font-family="Helvetica" font-size="14" font-weight="bold" fill="#8091a6" text-anchor="middle">12</text>
  <text x="296" y="108" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>

  <!-- row 2: Announcements, pinned + muted -->
  <image x="0" y="137" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="0" y="137" width="320" height="72" fill="#ebf0f5"/>
  <rect x="8" y="145" width="56" height="56" rx="5" ry="5" fill="#e09602"/>
  <text x="36" y="183" font-family="Helvetica" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <text x="73" y="160" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Announcements</text>
  <image x="181" y="151" width="13" height="13" preserveAspectRatio="none" xlink:href="ASSET:DialogList_Muted"/>
  <text x="311" y="160" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Tue</text>
  <text x="73" y="180" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Dmitry:</text>
  <text x="117" y="180" font-family="Helvetica" font-size="14" fill="#5b646e">1.7 is out on the store, changelog</text>
  <text x="73" y="196" font-family="Helvetica" font-size="14" fill="#5b646e">in the pinned message</text>
  <image x="285" y="166" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="298" y="182" font-family="Helvetica" font-size="14" font-weight="bold" fill="#8091a6" text-anchor="middle">3</text>
  <text x="298" y="181" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- row 3 -->
  <image x="0" y="210" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="218" width="56" height="56" rx="5" ry="5" fill="#ee4928"/>
  <text x="36" y="256" font-family="Helvetica" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <text x="73" y="233" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Bug Reports</text>
  <text x="311" y="233" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Tue</text>
  <text x="73" y="253" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Kate:</text>
  <text x="105" y="253" font-family="Helvetica" font-size="14" fill="#888888">crash on the 4S when opening a</text>
  <text x="73" y="269" font-family="Helvetica" font-size="14" fill="#888888">voice note twice in a row</text>

  <!-- row 4: closed topic -->
  <image x="0" y="283" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="291" width="56" height="56" rx="5" ry="5" fill="#8f3bf7"/>
  <text x="36" y="329" font-family="Helvetica" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">R</text>
  <text x="73" y="306" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Release 1.6 (closed)</text>
  <text x="311" y="306" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Mon</text>
  <text x="73" y="326" font-family="Helvetica" font-size="14" fill="#536c8c">Topic closed by Dmitry</text>
  <text x="73" y="342" font-family="Helvetica" font-size="14" fill="#888888">142 messages</text>

  <!-- row 5 -->
  <image x="0" y="356" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="364" width="56" height="56" rx="5" ry="5" fill="#41a903"/>
  <text x="36" y="402" font-family="Helvetica" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text>
  <text x="73" y="379" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Off-Topic</text>
  <text x="311" y="379" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">18.03</text>
  <text x="73" y="399" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Pavel:</text>
  <text x="110" y="399" font-family="Helvetica" font-size="14" fill="#888888">Photo</text>
  <text x="73" y="415" font-family="Helvetica" font-size="14" fill="#888888">my desk setup for the weekend</text>

  <!-- row 6, cut by the screen edge -->
  <image x="0" y="429" width="320" height="73" preserveAspectRatio="none" xlink:href="ASSET:DialogListCell"/>
  <rect x="8" y="437" width="56" height="43" rx="5" ry="5" fill="#00a1c4"/>
  <text x="36" y="472" font-family="Helvetica" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
  <text x="73" y="452" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Design</text>
  <text x="311" y="452" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">17.03</text>
  <text x="73" y="472" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Anna:</text>
  <text x="107" y="472" font-family="Helvetica" font-size="14" fill="#888888">the new icon set is uploaded</text>
</svg>
