turn of the</text><text x="412" y="198" font-family="Helvetica" font-size="13" font-weight="bold" fill="#111" text-anchor="start">small phone</text><text x="412" y="218" font-family="Helvetica" font-size="12" font-weight="normal" fill="#555" text-anchor="start">A 4-inch screen forces</text><text x="412" y="234" font-family="Helvetica" font-size="12" font-weight="normal" fill="#555" text-anchor="start">choices a large one never...</text><text x="592" y="266" font-family="Helvetica" font-size="11" font-weight="normal" fill="#8b97a5" text-anchor="start">14:02</text><rect x="382" y="300" width="296" height="44" fill="#f6f7f9" stroke="#d6dae0" stroke-width="1"/><text x="396" y="327" font-family="Helvetica" font-size="15" font-weight="bold" fill="#2f6ba8" text-anchor="start">Open link</text><text x="664" y="327" font-family="Helvetica" font-size="18" font-weight="normal" fill="#b7bec7" text-anchor="end">›</text><rect x="382" y="358" width="296" height="80" fill="#fdf6e6" stroke="#a8741d"/><rect x="382" y="358" width="3" height="80" fill="#a8741d"/><text x="393" y="375" font-family="Helvetica" font-size="11" font-weight="normal" fill="#6b4a10" text-anchor="start">The preview is ours, drawn in the bubble.</text><text x="393" y="390" font-family="Helvetica" font-size="11" font-weight="normal" fill="#6b4a10" text-anchor="start">The article itself opens in the system browser:</text><text x="393" y="405" font-family="Helvetica" font-size="11" font-weight="normal" fill="#6b4a10" text-anchor="start">iOS 6 has only UIWebView, which cannot render</text><text x="393" y="420" font-family="Helvetica" font-size="11" font-weight="normal" fill="#6b4a10" text-anchor="start">an Instant View page at acceptable speed.</text></svg>