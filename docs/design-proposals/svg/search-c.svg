<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="43" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="243" y="27" width="72" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="279" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Options</text>
  <text x="160" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Search</text>

  <!-- search bar with an in-field scope token -->
  <image x="0" y="64" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:SearchBarBackground"/>
  <image x="8" y="70" width="304" height="32" preserveAspectRatio="none" xlink:href="ASSET:SearchInputField"/>
  <image x="17" y="78" width="15" height="16" xlink:href="ASSET:SearchBarIcon"/>
  <image x="36" y="75" width="98" height="22" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="78" y="90" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Design Team</text>
  <text x="124" y="91" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff">x</text>
  <text x="140" y="91" font-family="Helvetica" font-size="16" fill="#111111">mockup</text>
  <image x="285" y="77" width="19" height="19" xlink:href="ASSET:ClearInput"/>

  <!-- results, full height -->
  <image x="0" y="108" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDivider"/>
  <text x="10" y="126" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">Messages in Design Team</text>

  <image x="0" y="134" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="139" width="40" height="40" rx="4" ry="4" fill="#0f94ed"/>
  <text x="25" y="165" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ND</text>
  <text x="54" y="159" font-family="Helvetica" font-size="19" fill="#111111">Nadia Designer</text>
  <text x="311" y="156" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">14:02</text>
  <text x="55" y="175" font-family="Helvetica" font-size="13" fill="#888888">final mockup is in the folder</text>

  <image x="0" y="185" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="190" width="40" height="40" rx="4" ry="4" fill="#ee4928"/>
  <text x="25" y="216" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">AK</text>
  <text x="54" y="210" font-family="Helvetica" font-size="19" fill="#111111">Alice Kovalenko</text>
  <text x="311" y="207" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">11:40</text>
  <text x="55" y="226" font-family="Helvetica" font-size="13" fill="#888888">mockup 4 needs a darker bar</text>

  <image x="0" y="236" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="241" width="40" height="40" rx="4" ry="4" fill="#e09602"/>
  <text x="25" y="267" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">DO</text>
  <text x="54" y="261" font-family="Helvetica" font-size="19" fill="#111111">Dmitry Orlov</text>
  <text x="311" y="258" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Mon</text>
  <text x="55" y="277" font-family="Helvetica" font-size="13" fill="#888888">re-exported the mockup at 2x</text>

  <image x="0" y="287" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="292" width="40" height="40" rx="4" ry="4" fill="#0f94ed"/>
  <text x="25" y="318" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ND</text>
  <text x="54" y="312" font-family="Helvetica" font-size="19" fill="#111111">Nadia Designer</text>
  <text x="311" y="309" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">12 Aug</text>
  <text x="55" y="328" font-family="Helvetica" font-size="13" fill="#888888">mockup review at 16:00</text>

  <image x="0" y="338" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="343" width="40" height="40" rx="4" ry="4" fill="#8f3bf7"/>
  <text x="25" y="369" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">PK</text>
  <text x="54" y="363" font-family="Helvetica" font-size="19" fill="#111111">Pavel Kuznetsov</text>
  <text x="311" y="360" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">9 Aug</text>
  <text x="55" y="379" font-family="Helvetica" font-size="13" fill="#888888">old mockup archive attached</text>

  <image x="0" y="389" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="394" width="40" height="40" rx="4" ry="4" fill="#41a903"/>
  <text x="25" y="420" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">SG</text>
  <text x="54" y="414" font-family="Helvetica" font-size="19" fill="#111111">Sergey Grishin</text>
  <text x="311" y="411" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">7 Aug</text>
  <text x="55" y="430" font-family="Helvetica" font-size="13" fill="#888888">mockup vs build comparison</text>

  <!-- load-more footer row -->
  <image x="0" y="440" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:Footer"/>
  <text x="160" y="468" font-family="Helvetica" font-size="16" font-weight="bold" fill="#0779d0" text-anchor="middle">Show 42 more results</text>
  </g>
</svg>
