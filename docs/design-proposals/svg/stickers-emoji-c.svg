<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/><stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e9f0"/><stop offset="1" stop-color="#dfe4eb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#e4e9f0"/>
  <image x="0" y="20" width="320" height="244" xlink:href="ASSET:wallpaper" preserveAspectRatio="xMidYMid slice"/>

  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">●●●●● Telegram</text>
  <text x="152" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">9:41</text>
  <text x="286" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">100%</text>

  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="62" height="30" xlink:href="ASSET:BackButton"/>
  <text x="26" y="47" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff">Chats</text>
  <text x="160" y="43" font-family="Helvetica" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Design Team</text>
  <text x="160" y="56" font-family="Helvetica" font-size="11" fill="#c9dcf2" text-anchor="middle">4 members</text>
  <rect x="0" y="63" width="320" height="1" fill="#2f4a6b"/>

  <!-- chat content -->
  <g>
    <path d="M12 76 h150 a5 5 0 0 1 5 5 v26 a5 5 0 0 1 -5 5 h-144 l-6 6 v-6 a5 5 0 0 1 -5 -5 v-26 a5 5 0 0 1 5 -5 z" fill="#ffffff" stroke="#c9ced6" stroke-width="0.5"/>
    <text x="20" y="90" font-family="Helvetica" font-size="13" font-weight="bold" fill="#4d688c">Nadia</text>
    <text x="20" y="105" font-family="Helvetica" font-size="15" fill="#141617">pick one</text>
    <text x="140" y="105" font-family="Helvetica" font-size="11" fill="#232d37">10:19</text>
  </g>

  <!-- input panel -->
  <image x="0" y="219" width="320" height="45" xlink:href="ASSET:ConversationInputPanel"/>
  <image x="4" y="226" width="30" height="30" xlink:href="ASSET:AttachBtn"/>
  <rect x="38" y="226" width="216" height="31" rx="5" fill="#ffffff" stroke="#a8b1bb" stroke-width="0.5"/>
  <text x="46" y="246" font-family="Helvetica" font-size="16" fill="#9da7b3">Message</text>
  <g transform="translate(228,229)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="#3c6696" stroke-width="1.5"/>
    <circle cx="8" cy="9" r="1.4" fill="#3c6696"/><circle cx="16" cy="9" r="1.4" fill="#3c6696"/>
    <path d="M7 15 q5 5 10 0" stroke="#3c6696" stroke-width="1.5" fill="none"/>
  </g>
  <image x="258" y="226" width="58" height="31" xlink:href="ASSET:SendButton"/>
  <text x="287" y="246" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Send</text>

  <!-- ===== paged deck panel ===== -->
  <rect x="0" y="264" width="320" height="216" fill="#dfe4eb"/>
  <!-- panel header, 30 -->
  <rect x="0" y="264" width="320" height="30" fill="url(#hdr)"/>
  <rect x="0" y="293" width="320" height="1" fill="#c2cad4"/>
  <path d="M14 273 l-6 6 l6 6" stroke="#6c7a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M306 273 l6 6 l-6 6" stroke="#6c7a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="160" y="284" font-family="Helvetica" font-size="13" font-weight="bold" fill="#697487" text-anchor="middle">COZY CATS</text>

  <!-- page 1, two plated rows of four 72pt tiles -->
  <image x="0" y="294" width="320" height="78" xlink:href="ASSET:Cell102"/>
  <image x="0" y="372" width="320" height="78" xlink:href="ASSET:Cell102"/>

  <g transform="translate(2,297)">
    <circle cx="36" cy="38" r="26" fill="#f0a860"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#f0a860"/>
    <circle cx="27" cy="34" r="3.6" fill="#3a2412"/><circle cx="45" cy="34" r="3.6" fill="#3a2412"/>
    <path d="M27 48 q9 7 18 0" stroke="#3a2412" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(78,297)">
    <circle cx="36" cy="38" r="26" fill="#9ec9ea"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#9ec9ea"/>
    <path d="M25 32 l9 6 M47 32 l-9 6" stroke="#123a5e" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="36" cy="50" rx="8" ry="5" fill="#123a5e"/>
  </g>
  <!-- tile under the finger: highlighted plate + preview overlay above -->
  <g transform="translate(154,297)">
    <rect x="-2" y="-3" width="76" height="78" fill="#e9eff5"/>
    <circle cx="36" cy="38" r="26" fill="#c9b0e8"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#c9b0e8"/>
    <circle cx="27" cy="35" r="3.6" fill="#3d2a5e"/><circle cx="45" cy="35" r="3.6" fill="#3d2a5e"/>
    <path d="M26 48 h20" stroke="#3d2a5e" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(230,297)">
    <circle cx="36" cy="38" r="26" fill="#f2d15c"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#f2d15c"/>
    <path d="M25 30 q5 -5 10 0" stroke="#4a3a08" stroke-width="2.4" fill="none"/>
    <path d="M26 46 q10 8 20 0" stroke="#4a3a08" stroke-width="2.6" fill="none"/>
    <circle cx="62" cy="62" r="7" fill="#000000" opacity="0.35"/><path d="M60 58.5 l5 3.5 l-5 3.5z" fill="#ffffff"/>
  </g>

  <g transform="translate(2,375)">
    <circle cx="36" cy="38" r="26" fill="#8fd6a8"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#8fd6a8"/>
    <circle cx="27" cy="34" r="3.6" fill="#12452a"/><circle cx="45" cy="34" r="3.6" fill="#12452a"/>
    <path d="M27 47 q9 7 18 0" stroke="#12452a" stroke-width="2.6" fill="none"/>
  </g>
  <g transform="translate(78,375)">
    <circle cx="36" cy="38" r="26" fill="#f0908f"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#f0908f"/>
    <path d="M26 32 h8 M38 32 h8" stroke="#5a1f1f" stroke-width="2.6"/>
    <path d="M28 50 q8 -8 16 0" stroke="#5a1f1f" stroke-width="2.6" fill="none"/>
  </g>
  <g transform="translate(154,375)">
    <circle cx="36" cy="38" r="26" fill="#b5b5b5"/><path d="M12 16 l8 14 l-14 3z M60 16 l-8 14 l14 3z" fill="#b5b5b5"/>
    <circle cx="27" cy="34" r="3.6" fill="#2e2e2e"/><circle cx="45" cy="34" r="3.6" fill="#2e2e2e"/>
    <ellipse cx="36" cy="48" rx="7" ry="5" fill="#2e2e2e"/>
    <circle cx="62" cy="62" r="7" fill="#000000" opacity="0.35"/><path d="M60 58.5 l5 3.5 l-5 3.5z" fill="#ffffff"/>
  </g>
  <!-- still-downloading tile: grey rounded placeholder -->
  <g transform="translate(230,375)">
    <rect x="6" y="8" width="60" height="60" rx="8" fill="#cfd6de"/>
  </g>

  <!-- page dots band, 30 -->
  <rect x="0" y="450" width="320" height="30" fill="#d3dae2"/>
  <rect x="0" y="450" width="320" height="1" fill="#b6bfca"/>
  <circle cx="118" cy="465" r="3.5" fill="#6c7a8a"/>
  <circle cx="134" cy="465" r="3.5" fill="#aab3bd"/>
  <circle cx="150" cy="465" r="3.5" fill="#aab3bd"/>
  <circle cx="166" cy="465" r="3.5" fill="#aab3bd"/>
  <circle cx="182" cy="465" r="3.5" fill="#aab3bd"/>
  <circle cx="198" cy="465" r="3.5" fill="#aab3bd"/>
  <image x="8" y="455" width="60" height="21" xlink:href="ASSET:GroupedActionButton"/>
  <text x="38" y="469" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SETS</text>
  <image x="252" y="455" width="60" height="21" xlink:href="ASSET:GroupedActionButton"/>
  <text x="282" y="469" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RECENT</text>

  <!-- long-press preview overlay: the only sticker allowed to animate -->
  <rect x="0" y="20" width="320" height="244" fill="#000000" opacity="0.28"/>
  <g>
    <rect x="72" y="72" width="176" height="176" rx="8" fill="#ffffff" opacity="0.96" stroke="#9aa5b1" stroke-width="0.5"/>
    <g transform="translate(96,88)">
      <circle cx="64" cy="66" r="46" fill="#c9b0e8"/>
      <path d="M22 26 l14 24 l-24 6z M106 26 l-14 24 l24 6z" fill="#c9b0e8"/>
      <circle cx="48" cy="60" r="6.5" fill="#3d2a5e"/><circle cx="80" cy="60" r="6.5" fill="#3d2a5e"/>
      <path d="M46 84 h36" stroke="#3d2a5e" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <text x="160" y="238" font-family="Helvetica" font-size="13" font-weight="bold" fill="#697487" text-anchor="middle">Cozy Cats — release to send</text>
  </g>
</svg>
