  <rect x="240" y="64" width="80" height="79" fill="url(#q4)"/>

  <rect x="0" y="144" width="79" height="79" fill="url(#q5)"/>
  <rect x="80" y="144" width="79" height="79" fill="url(#q6)"/>
  <rect x="160" y="144" width="79" height="79" fill="url(#q7)"/>
  <rect x="240" y="144" width="80" height="79" fill="url(#q8)"/>
  <use xlink:href="#play2" x="39" y="183"/>
  <rect x="2" y="207" width="27" height="13" fill="#000000" opacity="0.4"/>
  <text x="5" y="217" font-family="Helvetica" font-weight="bold" font-size="10" fill="#ffffff">0:22</text>

  <rect x="0" y="224" width="79" height="79" fill="url(#q3)"/>
  <rect x="80" y="224" width="79" height="79" fill="url(#q8)"/>
  <rect x="160" y="224" width="79" height="79" fill="url(#q2)"/>
  <rect x="240" y="224" width="80" height="79" fill="url(#q5)"/>

  <rect x="0" y="304" width="79" height="79" fill="url(#q7)"/>
  <rect x="80" y="304" width="79" height="79" fill="url(#q4)"/>
  <rect x="160" y="304" width="79" height="79" fill="url(#q6)"/>
  <rect x="240" y="304" width="80" height="79" fill="url(#q1)"/>
  <!-- placeholder tile: thumb not decoded yet -->
  <rect x="80" y="304" width="79" height="79" fill="#e4e9f0"/>
  <rect x="80" y="304" width="79" height="79" fill="none" stroke="#d5dee5" stroke-width="1"/>
  <circle cx="119" cy="343" r="8" fill="none" stroke="#b6c1cd" stroke-width="2"/>

  <rect x="0" y="384" width="79" height="52" fill="url(#q2)"/>
  <rect x="80" y="384" width="79" height="52" fill="url(#q5)"/>
  <rect x="160" y="384" width="79" height="52" fill="url(#q1)"/>
  <rect x="240" y="384" width="80" height="52" fill="url(#q3)"/>

  <!-- sticky month strip pinned at the top of the scroll area -->
  <rect x="0" y="64" width="320" height="25" fill="url(#hdr)"/>
  <rect x="0" y="88" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="82" font-family="Helvetica" font-weight="bold" font-size="15" fill="#ffffff">August 2026</text>
  <text x="10" y="81" font-family="Helvetica" font-weight="bold" font-size="15" fill="#697487">August 2026</text>
  <text x="310" y="81" font-family="Helvetica" font-size="13" fill="#697487" text-anchor="end">64 items</text>

  <!-- docked 44pt download tray -->
  <rect x="0" y="436" width="320" height="44" fill="url(#tray)"/>
  <rect x="0" y="436" width="320" height="1" fill="#d5dee5"/>
