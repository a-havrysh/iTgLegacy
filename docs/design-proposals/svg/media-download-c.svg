      <stop offset="1" stop-color="#dfe4eb"/>
    </linearGradient>
    <linearGradient id="q1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93aec8"/><stop offset="1" stop-color="#3f5a72"/></linearGradient>
    <linearGradient id="q2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcc59d"/><stop offset="1" stop-color="#8f7146"/></linearGradient>
    <linearGradient id="q3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#abc793"/><stop offset="1" stop-color="#4d6b39"/></linearGradient>
    <linearGradient id="q4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cba5b7"/><stop offset="1" stop-color="#73465b"/></linearGradient>
    <linearGradient id="q5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3b9cb"/><stop offset="1" stop-color="#33516a"/></linearGradient>
    <linearGradient id="q6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2d6ba"/><stop offset="1" stop-color="#877a5b"/></linearGradient>
    <linearGradient id="q7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bccbd8"/><stop offset="1" stop-color="#586d80"/></linearGradient>
    <linearGradient id="q8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9b4d1"/><stop offset="1" stop-color="#59456e"/></linearGradient>
    <g id="play2">
      <circle cx="0" cy="0" r="11" fill="#000000" opacity="0.35"/>
      <path d="M-3.5 -5.5 L6 0 L-3.5 5.5 Z" fill="#ffffff"/>
    </g>
