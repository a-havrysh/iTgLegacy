  <text x="46" y="470" font-family="Helvetica" font-size="13" fill="#888888">7.6 MB of 18.2 MB · 320 KB/s</text>
  <rect x="46" y="473" width="200" height="2" fill="#d5dee5"/>
  <rect x="46" y="473" width="84" height="2" fill="#0779d0"/>
  <image x="256" y="447" width="35" height="22" xlink:href="ASSET:MenuButtonCenter"/>
  <text x="273" y="462" font-family="Helvetica" font-weight="bold" font-size="12" fill="#4a6587" text-anchor="middle">II</text>
  <path d="M301 448 L306 453 L301 458" fill="none" stroke="#9aa4b0" stroke-width="2" stroke-linecap="round"/>
