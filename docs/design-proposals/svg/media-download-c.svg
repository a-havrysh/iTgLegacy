  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">•••••  Telegram</text>
  <text x="146" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">14:26</text>
  <rect x="286" y="6" width="22" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="15" height="5" fill="#ffffff"/>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <rect x="0" y="63" width="320" height="1" fill="#2f4d70"/>
  <image x="5" y="27" width="56" height="30" xlink:href="ASSET:BackButton"/>
