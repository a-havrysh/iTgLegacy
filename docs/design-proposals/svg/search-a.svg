<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="43" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="253" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="284" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Filter</text>
  <text x="160" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Search</text>

  <!-- search bar -->
  <image x="0" y="64" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:SearchBarBackground"/>
  <image x="8" y="70" width="304" height="32" preserveAspectRatio="none" xlink:href="ASSET:SearchInputField"/>
  <image x="17" y="78" width="15" height="16" xlink:href="ASSET:SearchBarIcon"/>
  <text x="38" y="91" font-family="Helvetica" font-size="16" fill="#111111">design</text>
  <image x="285" y="77" width="19" height="19" xlink:href="ASSET:ClearInput"/>

  <!-- scope bar, 36pt -->
  <image x="0" y="108" width="320" height="36" preserveAspectRatio="none" xlink:href="ASSET:SearchBarBackground"/>
  <image x="6" y="111" width="58" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="35" y="130" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">All</text>
  <image x="68" y="111" width="58" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="97" y="130" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">Media</text>
  <image x="130" y="111" width="58" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="159" y="130" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">Links</text>
  <image x="192" y="111" width="58" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="221" y="130" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">Files</text>
  <image x="254" y="111" width="60" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="284" y="130" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b" text-anchor="middle">Voice</text>

  <!-- section: Chats -->
  <image x="0" y="144" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDivider"/>
  <text x="10" y="162" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">Chats</text>

  <!-- row 1 -->
  <image x="0" y="170" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="175" width="40" height="40" rx="4" ry="4" fill="#41a903"/>
  <text x="25" y="201" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <image x="54" y="180" width="12" height="12" xlink:href="ASSET:DialogListGroupChatIcon"/>
  <text x="70" y="195" font-family="Helvetica" font-size="19" fill="#111111">Design Team</text>
  <text x="55" y="211" font-family="Helvetica" font-size="13" fill="#888888">14 members, 3 online</text>

  <!-- row 2 -->
  <image x="0" y="221" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="226" width="40" height="40" rx="4" ry="4" fill="#0f94ed"/>
  <text x="25" y="252" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ND</text>
  <text x="54" y="246" font-family="Helvetica" font-size="19" fill="#111111">Nadia <tspan font-weight="bold">Design</tspan>er</text>
  <text x="55" y="262" font-family="Helvetica" font-size="13" fill="#888888">last seen 20 minutes ago</text>

  <!-- section: Messages -->
  <image x="0" y="272" width="320" height="26" preserveAspectRatio="none" xlink:href="ASSET:CategoryDivider"/>
  <text x="10" y="290" font-family="Helvetica" font-size="15" font-weight="bold" fill="#697487">Messages</text>

  <!-- message rows -->
  <image x="0" y="298" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="303" width="40" height="40" rx="4" ry="4" fill="#ee4928"/>
  <text x="25" y="329" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">AK</text>
  <text x="54" y="323" font-family="Helvetica" font-size="19" fill="#111111">Alice Kovalenko</text>
  <text x="311" y="320" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">14:02</text>
  <text x="55" y="339" font-family="Helvetica" font-size="13" fill="#888888">the new design is on the server now</text>

  <image x="0" y="349" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="354" width="40" height="40" rx="4" ry="4" fill="#e09602"/>
  <text x="25" y="380" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">DO</text>
  <text x="54" y="374" font-family="Helvetica" font-size="19" fill="#111111">Dmitry Orlov</text>
  <text x="311" y="371" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">Mon</text>
  <text x="55" y="390" font-family="Helvetica" font-size="13" fill="#888888">design review moved to Thursday</text>

  <image x="0" y="400" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="405" width="40" height="40" rx="4" ry="4" fill="#41a903"/>
  <text x="25" y="431" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <text x="54" y="425" font-family="Helvetica" font-size="19" fill="#111111">Design Team</text>
  <text x="311" y="422" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">12 Aug</text>
  <text x="55" y="441" font-family="Helvetica" font-size="13" fill="#888888"><tspan fill="#345f8f" font-weight="bold">Nadia: </tspan>design tokens are frozen</text>

  <image x="0" y="451" width="320" height="51" preserveAspectRatio="none" xlink:href="ASSET:Cell102"/>
  <rect x="5" y="456" width="40" height="40" rx="4" ry="4" fill="#8f3bf7"/>
  <text x="25" y="482" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">PK</text>
  <text x="54" y="476" font-family="Helvetica" font-size="19" fill="#111111">Pavel Kuznetsov</text>
  <text x="311" y="473" font-family="Helvetica" font-size="13" fill="#337acc" text-anchor="end">9 Aug</text>
  </g>
</svg>
