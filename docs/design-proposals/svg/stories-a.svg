<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f63"/>
      <stop offset="0.45" stop-color="#7f6a86"/>
      <stop offset="0.75" stop-color="#e0906a"/>
      <stop offset="1" stop-color="#f2c187"/>
    </linearGradient>
    <clipPath id="photoclip">
      <rect x="60" y="76" width="200" height="356"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#000000"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">14:32</text>
  <text x="303" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">78%</text>

  <!-- navigation bar -->
  <image x="0" y="20" width="320" height="44" preserveAspectRatio="none" xlink:href="ASSET:NavBarBackground"/>
  <image x="5" y="27" width="58" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="23" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">Stories</text>
  <text x="160" y="41" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Alena Grishko</text>
  <text x="160" y="56" font-family="Helvetica" font-size="13" fill="#e0eefd" text-anchor="middle">2 of 5 &#183; 3 h ago</text>
  <image x="263" y="27" width="52" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="289" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">More</text>

  <!-- segmented position strip, 5 stories -->
  <rect x="4" y="66" width="60" height="3" fill="#ffffff"/>
  <rect x="66" y="66" width="60" height="3" fill="#ffffff"/>
  <rect x="128" y="66" width="60" height="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="190" y="66" width="60" height="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="252" y="66" width="60" height="3" fill="#ffffff" fill-opacity="0.3"/>

  <!-- letterboxed story photo, 9:16 fitted into the content area -->
  <g clip-path="url(#photoclip)">
    <rect x="60" y="76" width="200" height="356" fill="url(#sky)"/>
    <circle cx="196" cy="286" r="26" fill="#ffd9a0" fill-opacity="0.95"/>
    <path d="M60 372 L110 322 L152 366 L188 330 L260 400 L260 432 L60 432 Z" fill="#1d2230"/>
    <path d="M60 396 L96 366 L134 402 L170 372 L212 414 L260 380 L260 432 L60 432 Z" fill="#0f1219"/>
    <rect x="60" y="76" width="200" height="40" fill="#000000" fill-opacity="0.25"/>
  </g>

  <!-- caption plate over the foot of the photo -->
  <rect x="60" y="382" width="200" height="50" fill="#000000" fill-opacity="0.45"/>
  <text x="68" y="400" font-family="Helvetica" font-size="15" fill="#ffffff">Last light over the river.</text>
  <text x="68" y="418" font-family="Helvetica" font-size="15" fill="#ffffff">Went the long way home.</text>

  <!-- tap zones are invisible in the app; shown here as faint guides -->
  <text x="66" y="250" font-family="Helvetica" font-size="11" fill="#ffffff" fill-opacity="0.28">&#9664;</text>
  <text x="254" y="250" font-family="Helvetica" font-size="11" fill="#ffffff" fill-opacity="0.28">&#9654;</text>

  <!-- footer: group button bar, 30pt -->
  <image x="10" y="440" width="100" height="30" preserveAspectRatio="none" xlink:href="ASSET:ButtonGroupLeft"/>
  <image x="110" y="440" width="2" height="30" preserveAspectRatio="none" xlink:href="ASSET:ButtonGroupDivider"/>
  <image x="112" y="440" width="96" height="30" preserveAspectRatio="none" xlink:href="ASSET:ButtonGroupCenter"/>
  <image x="208" y="440" width="2" height="30" preserveAspectRatio="none" xlink:href="ASSET:ButtonGroupDivider"/>
  <image x="210" y="440" width="100" height="30" preserveAspectRatio="none" xlink:href="ASSET:ButtonGroupRight"/>
  <text x="60" y="459" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Reply</text>
  <text x="160" y="459" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&#9829; 12</text>
  <text x="260" y="459" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Share</text>
</svg>
