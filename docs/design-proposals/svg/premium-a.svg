<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="g1"><rect x="10" y="192" width="300" height="132" rx="8"/></clipPath>
    <clipPath id="g2"><rect x="10" y="366" width="300" height="132" rx="8"/></clipPath>
  </defs>

  <!-- patterned settings ground, SettingsBackground tiled vertically (320x35pt tile) -->
  <rect x="0" y="0" width="320" height="480" fill="#c7ccd4"/>
  <g>
    <image x="0" y="64" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="99" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="134" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="169" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="204" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="239" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="274" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="309" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="344" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="379" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="414" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
    <image x="0" y="449" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  </g>

  <!-- 86pt profile-style header -->
  <rect x="9" y="78" width="70" height="70" rx="10" fill="#e09602"/>
  <text x="44" y="126" font-family="Helvetica" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">&#9733;</text>
  <text x="94" y="98" font-family="Helvetica" font-size="19" font-weight="bold" fill="#edf0f5" opacity="0.28">Telegram Premium</text>
  <text x="94" y="97" font-family="Helvetica" font-size="19" font-weight="bold" fill="#222932">Telegram Premium</text>
  <text x="94" y="126" font-family="Helvetica" font-size="14" fill="#edf0f5" opacity="0.28">Not active on this account</text>
  <text x="94" y="125" font-family="Helvetica" font-size="14" fill="#6d7d90">Not active on this account</text>
  <text x="94" y="142" font-family="Helvetica" font-size="14" fill="#edf0f5" opacity="0.28">Cannot be bought here</text>
  <text x="94" y="141" font-family="Helvetica" font-size="14" fill="#697487">Cannot be bought here</text>

  <!-- caption: This account -->
  <text x="20" y="177" font-family="Helvetica" font-size="14" fill="#dae0e8">This account</text>
  <text x="20" y="176" font-family="Helvetica" font-size="14" fill="#697487">This account</text>

  <!-- group 1 : 3 x 44pt rows -->
  <rect x="10" y="192" width="300" height="132" rx="8" fill="#ffffff"/>
  <g clip-path="url(#g1)">
    <rect x="10" y="235" width="300" height="1" fill="#d5dee5"/>
    <rect x="10" y="279" width="300" height="1" fill="#d5dee5"/>
  </g>
  <rect x="10" y="192" width="300" height="132" rx="8" fill="none" stroke="#9ea3a9" stroke-opacity="0.55" stroke-width="1"/>

  <text x="20" y="219" font-family="Helvetica" font-size="16" fill="#000000">Premium status</text>
  <text x="300" y="219" font-family="Helvetica" font-size="15" fill="#356596" text-anchor="end">Off</text>

  <text x="20" y="263" font-family="Helvetica" font-size="16" fill="#000000">Download speed</text>
  <text x="300" y="263" font-family="Helvetica" font-size="15" fill="#356596" text-anchor="end">1&#215;  (4&#215; with Premium)</text>

  <text x="20" y="307" font-family="Helvetica" font-size="16" fill="#000000">Max upload size</text>
  <text x="300" y="307" font-family="Helvetica" font-size="15" fill="#356596" text-anchor="end">2 GB  (4 GB)</text>

  <!-- caption: Limits -->
  <text x="20" y="351" font-family="Helvetica" font-size="14" fill="#dae0e8">Limits &#8212; now / with Premium</text>
  <text x="20" y="350" font-family="Helvetica" font-size="14" fill="#697487">Limits &#8212; now / with Premium</text>

  <!-- group 2 -->
  <rect x="10" y="366" width="300" height="132" rx="8" fill="#ffffff"/>
  <g clip-path="url(#g2)">
    <rect x="10" y="409" width="300" height="1" fill="#d5dee5"/>
    <rect x="10" y="453" width="300" height="1" fill="#d5dee5"/>
  </g>
  <rect x="10" y="366" width="300" height="132" rx="8" fill="none" stroke="#9ea3a9" stroke-opacity="0.55" stroke-width="1"/>

  <text x="20" y="393" font-family="Helvetica" font-size="16" fill="#000000">Pinned chats</text>
  <text x="300" y="393" font-family="Helvetica" font-size="15" text-anchor="end"><tspan fill="#888888">5</tspan><tspan fill="#888888">  &#8594;  </tspan><tspan fill="#356596">10</tspan></text>

  <text x="20" y="437" font-family="Helvetica" font-size="16" fill="#000000">Chat folders</text>
  <text x="300" y="437" font-family="Helvetica" font-size="15" text-anchor="end"><tspan fill="#888888">10  &#8594;  </tspan><tspan fill="#356596">20</tspan></text>

  <text x="20" y="481" font-family="Helvetica" font-size="16" fill="#000000">Saved GIFs</text>
  <text x="300" y="481" font-family="Helvetica" font-size="15" text-anchor="end"><tspan fill="#888888">200  &#8594;  </tspan><tspan fill="#356596">400</tspan></text>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="0" y="20" width="320" height="44" xlink:href="ASSET:NavBarBackground"/>
  <image x="5" y="27" width="68" height="30" xlink:href="ASSET:BackButton"/>
  <text x="44" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0e284d" fill-opacity="0.4" text-anchor="middle">Settings</text>
  <text x="44" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Settings</text>
  <image x="263" y="27" width="52" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="289" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0e284d" fill-opacity="0.4" text-anchor="middle">Reload</text>
  <text x="289" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Reload</text>
  <text x="160" y="49" font-family="Helvetica" font-size="18" font-weight="bold" fill="#3d5c81" text-anchor="middle">Telegram Premium</text>
  <text x="160" y="48" font-family="Helvetica" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Telegram Premium</text>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">&#9679;&#9679;&#9679;&#9675;&#9675;  Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9:41</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>
</svg>
