<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/><stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="chatclip"><rect x="0" y="64" width="320" height="155"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#e4e9f0"/>
  <g clip-path="url(#chatclip)">
    <image x="0" y="20" width="320" height="244" xlink:href="ASSET:wallpaper" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">●●●●● Telegram</text>
  <text x="152" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">9:41</text>
  <text x="286" y="14" font-family="Helvetica" font-size="12" fill="#ffffff">100%</text>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="62" height="30" xlink:href="ASSET:BackButton"/>
  <text x="28" y="47" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">Chats</text>
  <text x="160" y="43" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">GitHub Bot</text>
  <text x="160" y="56" font-family="Helvetica" font-size="11" fill="#c9dcf2" text-anchor="middle">bot</text>
  <rect x="0" y="63" width="320" height="1" fill="#2f4a6b"/>

  <!-- incoming bubble -->
  <g>
    <path d="M12 70 h206 a5 5 0 0 1 5 5 v34 a5 5 0 0 1 -5 5 h-200 l-6 6 v-6 a5 5 0 0 1 -5 -5 v-34 a5 5 0 0 1 5 -5 z" fill="#ffffff" stroke="#c9ced6" stroke-width="0.5"/>
    <text x="20" y="88" font-family="Helvetica" font-size="15" fill="#141617">Pick a repository to watch.</text>
    <text x="20" y="105" font-family="Helvetica" font-size="15" fill="#141617">You have 4 subscriptions.</text>
    <text x="199" y="111" font-family="Helvetica" font-size="11" fill="#232d37">10:22</text>
  </g>

  <!-- inline keyboard: ButtonGroup bars, 30pt rows, 4pt gap, left-aligned with the bubble -->
  <image x="12" y="120" width="106" height="30" xlink:href="ASSET:ButtonGroupLeft"/>
  <image x="118" y="120" width="105" height="30" xlink:href="ASSET:ButtonGroupRight"/>
  <image x="118" y="120" width="2" height="30" xlink:href="ASSET:ButtonGroupDivider"/>
  <text x="65" y="139" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">telegram-ios</text>
  <text x="170" y="139" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">tdlib</text>

  <image x="12" y="154" width="70" height="30" xlink:href="ASSET:ButtonGroupLeft"/>
  <image x="82" y="154" width="70" height="30" xlink:href="ASSET:ButtonGroupCenter"/>
  <image x="152" y="154" width="71" height="30" xlink:href="ASSET:ButtonGroupRight_Highlighted"/>
  <image x="82" y="154" width="2" height="30" xlink:href="ASSET:ButtonGroupDivider"/>
  <image x="152" y="154" width="2" height="30" xlink:href="ASSET:ButtonGroupDivider_RightHighlighted"/>
  <text x="47" y="173" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Issues</text>
  <text x="117" y="173" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Releases</text>
  <text x="188" y="173" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">↗ Open</text>

  <!-- outgoing bubble -->
  <g>
    <path d="M308 190 h-118 a5 5 0 0 0 -5 5 v17 a5 5 0 0 0 5 5 h112 l6 6 v-6 a5 5 0 0 0 5 -5 v-17 a5 5 0 0 0 -5 -5 z" fill="#e2f7c9" stroke="#b7d99a" stroke-width="0.5"/>
    <text x="194" y="208" font-family="Helvetica" font-size="15" fill="#141617">Issues</text>
    <text x="272" y="212" font-family="Helvetica" font-size="11" fill="#232d37">10:23</text>
    <path d="M290 207 l3 4 l7 -8" stroke="#4d8a2f" stroke-width="1.4" fill="none"/>
  </g>

  <!-- input panel, 45pt, with the reply-keyboard toggle where the emoji button lives -->
  <image x="0" y="219" width="320" height="45" xlink:href="ASSET:ConversationInputPanel"/>
  <image x="4" y="226" width="30" height="30" xlink:href="ASSET:AttachBtn"/>
  <rect x="38" y="226" width="216" height="31" rx="5" fill="#ffffff" stroke="#a8b1bb" stroke-width="0.5"/>
  <text x="46" y="246" font-family="Helvetica" font-size="16" fill="#9da7b3">Message</text>
  <!-- keyboard-toggle glyph, 24x24, replaces the emoji slot while a reply markup is active -->
  <g transform="translate(228,229)">
    <rect x="0.5" y="3.5" width="23" height="17" rx="3" fill="none" stroke="#7d8794" stroke-width="1.5"/>
    <rect x="4" y="7" width="3" height="3" fill="#7d8794"/><rect x="10.5" y="7" width="3" height="3" fill="#7d8794"/><rect x="17" y="7" width="3" height="3" fill="#7d8794"/>
    <rect x="4" y="13.5" width="16" height="3" fill="#7d8794"/>
  </g>
  <image x="258" y="226" width="58" height="31" xlink:href="ASSET:SendButton"/>
  <text x="287" y="246" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Send</text>

  <!-- ===== reply-keyboard panel: 216pt, exactly where the system keyboard would be ===== -->
  <rect x="0" y="264" width="320" height="216" fill="#c3ccd6"/>
  <rect x="0" y="264" width="320" height="1" fill="#a3adb8"/>

  <!-- row 1: two GroupedActionButton plates, 43pt tall -->
  <image x="8" y="272" width="150" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <image x="162" y="272" width="150" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <text x="83" y="299" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">My subscriptions</text>
  <text x="237" y="299" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Notifications</text>

  <!-- row 2 -->
  <image x="8" y="321" width="150" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <image x="162" y="321" width="150" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <text x="83" y="348" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Settings</text>
  <text x="237" y="348" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Help</text>

  <!-- row 3: a special button carries a 14x14 glyph 4pt before its label -->
  <image x="8" y="370" width="304" height="43" xlink:href="ASSET:GroupedActionButtonGreen"/>
  <g transform="translate(112,384)">
    <path d="M8 0 c4 0 7 3 7 7 c0 5 -7 12 -7 12 c0 0 -7 -7 -7 -12 c0 -4 3 -7 7 -7 z" fill="#ffffff" opacity="0.9" transform="scale(0.7)"/>
  </g>
  <text x="168" y="397" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Share my location</text>

  <!-- row 4 -->
  <image x="8" y="419" width="304" height="43" xlink:href="ASSET:GroupedActionButton"/>
  <text x="160" y="446" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hide keyboard</text>
</svg>
