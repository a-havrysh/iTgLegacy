<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="sheetbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5460"/>
      <stop offset="1" stop-color="#242a33"/>
    </linearGradient>
    <linearGradient id="sheetbtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d99a8"/>
      <stop offset="1" stop-color="#55606f"/>
    </linearGradient>
    <linearGradient id="sheetcancel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a434f"/>
      <stop offset="1" stop-color="#1d2229"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="52" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="31" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit</text>
  <image x="279" y="27" width="36" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <image x="288" y="34" width="18" height="16" xlink:href="ASSET:ComposeMessageIcon"/>
  <!-- title acts as the folder switcher: name + caret -->
  <text x="152" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Work</text>
  <path d="M 190 39 L 200 39 L 195 45 Z" fill="#ffffff" opacity="0.9"/>

  <!-- row 1: unread background -->
  <rect x="0" y="64" width="320" height="73" fill="#ebf0f5"/>
  <rect x="8" y="72" width="56" height="56" rx="5" ry="5" fill="#0f94ed"/>
  <text x="36" y="108" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">DT</text>
  <image x="73" y="76" width="13" height="13" xlink:href="ASSET:DialogListGroupChatIcon"/>
  <text x="90" y="88" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Design Team</text>
  <text x="245" y="88" font-family="Helvetica" font-size="13" fill="#337acc">2:14 PM</text>
  <text x="73" y="107" font-family="Helvetica" font-size="14" font-weight="bold" fill="#345f8f">Maria:</text>
  <text x="115" y="107" font-family="Helvetica" font-size="14" fill="#5b646e">can you check the new cell</text>
  <text x="73" y="123" font-family="Helvetica" font-size="14" fill="#5b646e">spacing before the build?</text>
  <image x="265" y="93" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="278" y="108" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="0" y="136.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row 2: swiped open, three action buttons -->
  <rect x="0" y="137" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="145" width="56" height="56" rx="5" ry="5" fill="#ee4928"/>
  <text x="36" y="181" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AK</text>
  <text x="73" y="161" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Alexey Kudrin</text>
  <!-- swipe buttons: 61x31 at y = row + 20, right inset 10, 6pt gaps -->
  <rect x="115" y="157" width="61" height="31" rx="4" ry="4" fill="#8b97a5"/>
  <text x="145.5" y="177" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Mute</text>
  <rect x="182" y="157" width="61" height="31" rx="4" ry="4" fill="#337acc"/>
  <text x="212.5" y="177" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Pin</text>
  <rect x="249" y="157" width="61" height="31" rx="4" ry="4" fill="#c62b23"/>
  <text x="279.5" y="177" font-family="Helvetica" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Delete</text>
  <rect x="0" y="209.5" width="320" height="0.5" fill="#d5dee5"/>

  <!-- row 3 -->
  <rect x="0" y="210" width="320" height="73" fill="#ffffff"/>
  <rect x="8" y="218" width="56" height="56" rx="5" ry="5" fill="#41a903"/>
  <text x="36" y="254" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">SP</text>
  <text x="73" y="234" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Sales Planning</text>
  <image x="176" y="222" width="12" height="12" xlink:href="ASSET:DialogList_Muted"/>
  <text x="248" y="234" font-family="Helvetica" font-size="13" fill="#337acc">Yesterday</text>
  <text x="73" y="253" font-family="Helvetica" font-size="14" fill="#536c8c">Photo</text>

  <!-- action sheet raised from the title -->
  <rect x="0" y="64" width="320" height="416" fill="#000000" opacity="0.32"/>
  <rect x="0" y="196" width="320" height="284" fill="url(#sheetbg)"/>
  <rect x="0" y="196" width="320" height="0.5" fill="#8f9aa8"/>
  <text x="160" y="219" font-family="Helvetica" font-size="13" font-weight="bold" fill="#c9d3de" text-anchor="middle">Show chats from</text>

  <rect x="10" y="228" width="300" height="44" rx="6" ry="6" fill="url(#sheetbtn)"/>
  <text x="160" y="256" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">All Chats</text>
  <image x="248" y="238" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="261" y="253" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>

  <rect x="10" y="276" width="300" height="44" rx="6" ry="6" fill="url(#sheetbtn)"/>
  <text x="160" y="304" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Unread</text>
  <image x="248" y="286" width="27" height="21" preserveAspectRatio="none" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="261" y="301" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>

  <rect x="10" y="324" width="300" height="44" rx="6" ry="6" fill="url(#sheetbtn)"/>
  <text x="160" y="352" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Work</text>
  <path d="M 244 344 L 250 351 L 262 338" stroke="#ffffff" stroke-width="3" fill="none"/>

  <rect x="10" y="372" width="300" height="44" rx="6" ry="6" fill="url(#sheetbtn)"/>
  <text x="160" y="400" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Family</text>

  <rect x="10" y="426" width="300" height="44" rx="6" ry="6" fill="url(#sheetcancel)"/>
  <text x="160" y="454" font-family="Helvetica" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancel</text>
  </g>
</svg>
