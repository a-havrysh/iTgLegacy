<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#e9e2d4"/>
      <path d="M0 16 L16 0" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
      <path d="M0 8 L8 0" stroke="#d9d0bd" stroke-opacity="0.35" stroke-width="1"/>
      <path d="M8 16 L16 8" stroke="#d9d0bd" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <symbol id="thumb" viewBox="0 0 24 24">
      <rect x="2.5" y="10" width="5" height="11" rx="1.2" fill="#e2952a"/>
      <path d="M9 10 L12.8 3.2 C13.8 1.6 16.4 2.6 16 4.8 L15.1 9 H20.4 C21.9 9 22.9 10.2 22.6 11.6 L21.2 18.8 C20.9 20.2 19.9 21 18.6 21 H9 Z" fill="#f7c34a"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M12 21.2 C1.8 14.2 3 5 8 5 C10.3 5 12 6.9 12 8.4 C12 6.9 13.7 5 16 5 C21 5 22.2 14.2 12 21.2 Z" fill="#e8402a"/>
    </symbol>
    <symbol id="fire" viewBox="0 0 24 24">
      <path d="M12 1.8 C13.2 7 18.2 8.2 18.2 13.6 C18.2 17.8 15.4 21.2 12 21.2 C8.6 21.2 5.8 17.8 5.8 13.6 C5.8 10.4 8 9 9.1 6.4 C9.9 8.8 10.6 9.6 11 10.2 C11.5 8 11.6 4.8 12 1.8 Z" fill="#f5891f"/>
      <path d="M12 10.8 C13.1 13.4 15.1 14.6 15.1 16.7 C15.1 18.9 13.7 20.4 12 20.4 C10.3 20.4 8.9 18.9 8.9 16.7 C8.9 15 10.5 13.4 12 10.8 Z" fill="#f7d046"/>
    </symbol>
    <symbol id="joy" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.2" fill="#f7ce46"/>
      <path d="M5.6 11.6 C8.4 18.4 15.6 18.4 18.4 11.6 Z" fill="#7a4a12"/>
      <path d="M6.6 12.2 C9 12.9 15 12.9 17.4 12.2 C16.4 13.1 7.6 13.1 6.6 12.2 Z" fill="#ffffff"/>
      <path d="M6 8.4 C7 6.6 9.4 6.6 10.4 8.4" stroke="#7a4a12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M13.6 8.4 C14.6 6.6 17 6.6 18 8.4" stroke="#7a4a12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="url(#paper)"/>

  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9:41</text>
  <rect x="286" y="6" width="22" height="8" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="15" height="4" fill="#ffffff"/>

  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <rect x="0" y="63" width="320" height="1" fill="#2f4c6e"/>
  <image x="5" y="27" width="27" height="30" xlink:href="ASSET:BackButton"/>
  <text x="20" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <text x="160" y="38" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Design Team</text>
  <text x="160" y="53" font-family="Helvetica" font-size="13" fill="#e0eefd" text-anchor="middle">8 members, 3 online</text>

  <!-- incoming with a single reaction: the minimum case -->
  <rect x="6" y="84" width="30" height="30" rx="5" fill="#fc4380"/>
  <text x="21" y="105" font-family="Helvetica" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  <path d="M46 76 H196 A6 6 0 0 1 202 82 V140 A6 6 0 0 1 196 146 H46 A6 6 0 0 1 40 140 V88 L34 92 L40 82 A6 6 0 0 1 46 76 Z" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="0.5"/>
  <text x="52" y="93" font-family="Helvetica" font-size="13" font-weight="bold" fill="#fc4380">Nastya</text>
  <text x="52" y="112" font-family="Helvetica" font-size="15" fill="#141617">Shipping Friday?</text>
  <use xlink:href="#thumb" x="52" y="119" width="14" height="14"/>
  <image x="70" y="118" width="27" height="21" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="83" y="133" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="194" y="141" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">13:41</text>

  <!-- the subject message: four emoji, eleven people, one summary line -->
  <rect x="6" y="158" width="30" height="30" rx="5" fill="#0f94ed"/>
  <text x="21" y="179" font-family="Helvetica" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
  <path d="M46 150 H282 A6 6 0 0 1 288 156 V264 A6 6 0 0 1 282 270 H46 A6 6 0 0 1 40 264 V162 L34 166 L40 156 A6 6 0 0 1 46 150 Z" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="0.5"/>
  <text x="52" y="167" font-family="Helvetica" font-size="13" font-weight="bold" fill="#0f94ed">Pavel</text>
  <text x="52" y="187" font-family="Helvetica" font-size="15" fill="#141617">New icon set is on the beta build —</text>
  <text x="52" y="205" font-family="Helvetica" font-size="15" fill="#141617">grab it and tell me what breaks</text>
  <text x="52" y="223" font-family="Helvetica" font-size="15" fill="#141617">before Friday.</text>

  <!-- summary line: 20 pt tall, chosen emoji on a selected-fill square, then the stretched badge -->
  <rect x="49" y="230" width="20" height="20" rx="4" fill="#def0ff"/>
  <use xlink:href="#thumb" x="52" y="233" width="14" height="14"/>
  <use xlink:href="#heart" x="72" y="233" width="14" height="14"/>
  <use xlink:href="#fire" x="92" y="233" width="14" height="14"/>
  <use xlink:href="#joy" x="112" y="233" width="14" height="14"/>
  <image x="132" y="230" width="27" height="21" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="145" y="245" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">11</text>
  <text x="280" y="264" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">13:44</text>

  <!-- outgoing message, six distinct emoji, run truncated to five plus a spill count -->
  <path d="M136 278 H308 A6 6 0 0 1 314 284 V336 L320 340 L314 342 A6 6 0 0 1 308 342 H136 A6 6 0 0 1 130 336 V284 A6 6 0 0 1 136 278 Z" fill="#d3fbb1" stroke="#a9d68a" stroke-width="0.5"/>
  <text x="140" y="300" font-family="Helvetica" font-size="15" fill="#141617">Beta 42 is up, changelog in</text>
  <text x="140" y="318" font-family="Helvetica" font-size="15" fill="#141617">the pinned message.</text>
  <use xlink:href="#thumb" x="140" y="323" width="14" height="14"/>
  <use xlink:href="#heart" x="160" y="323" width="14" height="14"/>
  <use xlink:href="#fire" x="180" y="323" width="14" height="14"/>
  <use xlink:href="#joy" x="200" y="323" width="14" height="14"/>
  <text x="220" y="335" font-family="Helvetica" font-size="11" font-weight="bold" fill="#506e8d">+2</text>
  <image x="238" y="320" width="27" height="21" xlink:href="ASSET:DialogListUnreadBadge"/>
  <text x="251" y="335" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">27</text>
  <text x="304" y="337" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">13:45</text>

  <!-- TGPopupMenu opened by long press: React is the first item -->
  <image x="100" y="352" width="6" height="41" xlink:href="ASSET:MenuButtonLeft"/>
  <image x="106" y="352" width="128" height="41" xlink:href="ASSET:MenuButtonCenter"/>
  <image x="234" y="352" width="6" height="41" xlink:href="ASSET:MenuButtonRight"/>
  <image x="100" y="393" width="6" height="41" xlink:href="ASSET:MenuButtonLeft"/>
  <image x="106" y="393" width="128" height="41" xlink:href="ASSET:MenuButtonCenter"/>
  <image x="234" y="393" width="6" height="41" xlink:href="ASSET:MenuButtonRight"/>
  <rect x="100" y="392" width="140" height="1" fill="#1c2733"/>
  <text x="170" y="378" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">React</text>
  <text x="170" y="419" font-family="Helvetica" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Reply</text>
  <image x="160" y="338" width="20" height="15" xlink:href="ASSET:MenuArrowTop"/>

  <image x="0" y="437" width="320" height="43" xlink:href="ASSET:ConversationInputPanel_Background"/>
  <rect x="0" y="437" width="320" height="1" fill="#a3abb5"/>
  <image x="6" y="444" width="28" height="29" xlink:href="ASSET:AttachBtn"/>
  <rect x="40" y="444" width="232" height="29" rx="5" fill="#ffffff" stroke="#a9afb6" stroke-width="1"/>
  <text x="49" y="463" font-family="Helvetica" font-size="16" fill="#9da7b3">Message</text>
  <image x="279" y="444" width="35" height="29" xlink:href="ASSET:SendButton"/>
  <text x="296" y="463" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Send</text>
</svg>
