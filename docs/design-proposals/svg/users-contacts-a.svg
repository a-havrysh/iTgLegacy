<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="rowg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#e7ebf0"/>
    </linearGradient>
    <g id="chev">
      <path d="M0 0 L5 5 L0 10" fill="none" stroke="#9aa4b0" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#c8ccd1"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">•••••  Telegram</text>
  <text x="146" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">14:26</text>
  <rect x="286" y="6" width="22" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="15" height="5" fill="#ffffff"/>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <rect x="0" y="63" width="320" height="1" fill="#2f4d70"/>
  <image x="5" y="27" width="62" height="30" xlink:href="ASSET:BackButton"/>
  <text x="34" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Chat</text>
  <text x="160" y="49" font-family="Helvetica" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">Info</text>
  <image x="266" y="27" width="49" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="290" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Edit</text>

  <!-- profile header, 86 pt, unchanged geometry -->
  <rect x="0" y="64" width="320" height="86" fill="url(#hdr)"/>
  <rect x="0" y="149" width="320" height="1" fill="#a9b0b7"/>
  <rect x="9" y="78" width="70" height="70" rx="10" fill="#0f94ed"/>
  <text x="44" y="126" font-family="Helvetica" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">AP</text>

  <text x="94" y="105" font-family="Helvetica" font-weight="bold" font-size="19" fill="#eef1f6">Anna Petrova</text>
  <text x="94" y="104" font-family="Helvetica" font-weight="bold" font-size="19" fill="#222932">Anna Petrova</text>
  <text x="212" y="104" font-family="Helvetica" font-size="15">🎄</text>
  <text x="94" y="125" font-family="Helvetica" font-size="14" fill="#eef1f6">last seen 5 minutes ago</text>
  <text x="94" y="124" font-family="Helvetica" font-size="14" fill="#6d7d90">last seen 5 minutes ago</text>

  <!-- group 1: details, 4 x 44 -->
  <rect x="10" y="162" width="300" height="176" rx="8" fill="url(#rowg)" stroke="#a9b0b7" stroke-width="1"/>
  <line x1="10" y1="206" x2="310" y2="206" stroke="#cfd4d9" stroke-width="1"/>
  <line x1="10" y1="250" x2="310" y2="250" stroke="#cfd4d9" stroke-width="1"/>
  <line x1="10" y1="294" x2="310" y2="294" stroke="#cfd4d9" stroke-width="1"/>

  <text x="20" y="190" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">mobile</text>
  <text x="300" y="190" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">+7 916 145 22 08</text>

  <text x="20" y="234" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">username</text>
  <text x="300" y="234" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">@annapetrova</text>

  <text x="20" y="278" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">status</text>
  <text x="278" y="278" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">until 22:00</text>
  <text x="285" y="279" font-family="Helvetica" font-size="16">🎄</text>

  <text x="20" y="322" font-family="Helvetica" font-weight="bold" font-size="17" fill="#516691">birthday</text>
  <text x="300" y="322" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">11 February  (turns 29)</text>

  <!-- group 2: personal channel -->
  <rect x="10" y="352" width="300" height="44" rx="8" fill="url(#rowg)" stroke="#a9b0b7" stroke-width="1"/>
  <rect x="18" y="360" width="28" height="28" rx="3" fill="#41a903"/>
  <text x="32" y="380" font-family="Helvetica" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">P</text>
  <text x="54" y="376" font-family="Helvetica" font-weight="bold" font-size="17" fill="#0779d0">Petrova Photo</text>
  <text x="288" y="376" font-family="Helvetica" font-size="14" fill="#888888" text-anchor="end">channel</text>
  <use xlink:href="#chev" x="296" y="369"/>
  <text x="20" y="411" font-family="Helvetica" font-size="14" fill="#dfe4ea">Anna&#8217;s personal channel.</text>
  <text x="20" y="410" font-family="Helvetica" font-size="14" fill="#697487">Anna&#8217;s personal channel.</text>

  <!-- group 3: block -->
  <image x="10" y="426" width="300" height="44" xlink:href="ASSET:GroupedActionButton"/>
  <text x="160" y="454" font-family="Helvetica" font-weight="bold" font-size="16" fill="#0779d0" text-anchor="middle">Block user</text>
</svg>
