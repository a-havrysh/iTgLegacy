<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="navbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b8fb8"/><stop offset="1" stop-color="#25384f"/>
    </linearGradient>
    <clipPath id="coverclip"><rect x="0" y="144" width="320" height="150"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9:41</text>
  <text x="314" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">78%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#navbg)"/>
  <image x="5" y="27" width="58" height="30" xlink:href="ASSET:BackButton"/>
  <text x="39" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chat</text>
  <text x="160" y="47" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Instant View</text>
  <image x="255" y="27" width="60" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="285" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Share</text>

  <!-- kicker / site -->
  <text x="15" y="82" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0e7acd" letter-spacing="1">THE VERGE</text>

  <!-- pageBlockTitle -->
  <text x="15" y="105" font-family="Helvetica" font-size="19" font-weight="bold" fill="#141617">Telegram rebuilds its iOS</text>
  <text x="15" y="126" font-family="Helvetica" font-size="19" font-weight="bold" fill="#141617">client for older iPhones</text>

  <!-- pageBlockAuthorDate -->
  <text x="15" y="141" font-family="Helvetica" font-size="13" fill="#999999">Nikita Vlasov · 14 Aug 2013</text>

  <!-- pageBlockCover: full-bleed, downscaled to screen width -->
  <rect x="0" y="149" width="320" height="150" fill="url(#cover)"/>
  <g clip-path="url(#coverclip)">
    <circle cx="60" cy="185" r="20" fill="#a8c3de" opacity="0.65"/>
    <path d="M0 299 L92 205 L160 265 L228 210 L320 299 Z" fill="#182a3d" opacity="0.85"/>
  </g>
  <!-- pageBlockCaption -->
  <text x="15" y="315" font-family="Helvetica" font-size="13" fill="#697487">The 4S running the new build.</text>

  <!-- pageBlockParagraph -->
  <text x="15" y="337" font-family="Helvetica" font-size="15" fill="#141617">The team says the reader parses the</text>
  <text x="15" y="356" font-family="Helvetica" font-size="15" fill="#141617">article server-side, so the phone only</text>
  <text x="15" y="375" font-family="Helvetica" font-size="15" fill="#141617">ever draws <tspan font-weight="bold">text blocks</tspan> and images — no</text>
  <text x="15" y="394" font-family="Helvetica" font-size="15" fill="#141617">browser is involved at any point.</text>

  <!-- pageBlockBlockQuote: 2pt accent bar, +8 text column -->
  <rect x="15" y="406" width="2" height="52" fill="#0e7acd"/>
  <text x="25" y="421" font-family="Helvetica" font-size="15" font-style="italic" fill="#141617">“We render the same blocks the</text>
  <text x="25" y="440" font-family="Helvetica" font-size="15" font-style="italic" fill="#141617">desktop app renders.”</text>
  <text x="25" y="455" font-family="Helvetica" font-size="13" fill="#697487">— Pavel D.</text>

  <!-- divider before the next block, at the fold -->
  <image x="15" y="466" width="290" height="1" xlink:href="ASSET:CategoryDivider"/>
  <text x="15" y="478" font-family="Helvetica" font-size="15" font-weight="bold" fill="#141617">What changed</text>
</svg>
