<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f8"/>
      <stop offset="1" stop-color="#e2e8ef"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#e4e9f0"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fa9c4"/><stop offset="1" stop-color="#4a6379"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c39a"/><stop offset="1" stop-color="#96784c"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8c48f"/><stop offset="1" stop-color="#54713f"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a2b4"/><stop offset="1" stop-color="#7a4b60"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fb6c9"/><stop offset="1" stop-color="#38566e"/></linearGradient>
    <linearGradient id="p6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0d3b6"/><stop offset="1" stop-color="#8d8060"/></linearGradient>
    <linearGradient id="p7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c8d6"/><stop offset="1" stop-color="#5d7185"/></linearGradient>
    <linearGradient id="p8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6b1cf"/><stop offset="1" stop-color="#5e4a73"/></linearGradient>
    <g id="play">
      <circle cx="0" cy="0" r="11" fill="#000000" opacity="0.35"/>
      <path d="M-3.5 -5.5 L6 0 L-3.5 5.5 Z" fill="#ffffff"/>
    </g>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="8" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">•••••  Telegram</text>
  <text x="146" y="14" font-family="Helvetica" font-weight="bold" font-size="11" fill="#ffffff">14:26</text>
  <rect x="286" y="6" width="22" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="8" width="15" height="5" fill="#ffffff"/>

  <!-- nav bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <rect x="0" y="63" width="320" height="1" fill="#2f4d70"/>
  <image x="5" y="27" width="56" height="30" xlink:href="ASSET:BackButton"/>
  <text x="31" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Info</text>
  <text x="160" y="49" font-family="Helvetica" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">Shared Media</text>
  <image x="264" y="27" width="51" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="289" y="46" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Select</text>

  <!-- 44pt downloads banner (tableHeaderView) -->
  <rect x="0" y="64" width="320" height="44" fill="url(#banner)"/>
  <rect x="0" y="107" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="83" font-family="Helvetica" font-weight="bold" font-size="15" fill="#516691">Downloading 2 files</text>
  <text x="10" y="99" font-family="Helvetica" font-size="13" fill="#888888">4.8 MB of 11.2 MB · 320 KB/s</text>
  <rect x="10" y="102" width="240" height="2" fill="#d5dee5"/>
  <rect x="10" y="102" width="103" height="2" fill="#0779d0"/>
  <text x="292" y="90" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">43%</text>
  <path d="M303 80 L308 85 L303 90" fill="none" stroke="#9aa4b0" stroke-width="2" stroke-linecap="round"/>

  <!-- section header 25pt -->
  <rect x="0" y="108" width="320" height="25" fill="url(#hdr)"/>
  <rect x="0" y="132" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="126" font-family="Helvetica" font-weight="bold" font-size="15" fill="#ffffff">August 2026</text>
  <text x="10" y="125" font-family="Helvetica" font-weight="bold" font-size="15" fill="#697487">August 2026</text>

  <!-- grid row 1 : y 133 -->
  <rect x="0" y="133" width="79" height="79" fill="url(#p1)"/>
  <rect x="80" y="133" width="79" height="79" fill="url(#p2)"/>
  <rect x="160" y="133" width="79" height="79" fill="url(#p3)"/>
  <rect x="240" y="133" width="80" height="79" fill="url(#p4)"/>
  <use xlink:href="#play" x="119" y="172"/>
  <rect x="82" y="196" width="27" height="13" fill="#000000" opacity="0.4"/>
  <text x="85" y="206" font-family="Helvetica" font-weight="bold" font-size="10" fill="#ffffff">0:14</text>

  <!-- grid row 2 : y 213 -->
  <rect x="0" y="213" width="79" height="79" fill="url(#p5)"/>
  <rect x="80" y="213" width="79" height="79" fill="url(#p6)"/>
  <rect x="160" y="213" width="79" height="79" fill="url(#p7)"/>
  <rect x="240" y="213" width="80" height="79" fill="url(#p8)"/>
  <!-- one tile still downloading: dimmed with a progress ring -->
  <rect x="160" y="213" width="79" height="79" fill="#000000" opacity="0.35"/>
  <circle cx="199" cy="252" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M199 238 A14 14 0 0 1 210 258" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="196" y="249" width="7" height="7" fill="#ffffff"/>

  <!-- grid row 3 : y 293 -->
  <rect x="0" y="293" width="79" height="79" fill="url(#p3)"/>
  <rect x="80" y="293" width="79" height="79" fill="url(#p8)"/>
  <rect x="160" y="293" width="79" height="79" fill="url(#p2)"/>
  <rect x="240" y="293" width="80" height="79" fill="url(#p5)"/>
  <use xlink:href="#play" x="280" y="332"/>
  <rect x="242" y="356" width="27" height="13" fill="#000000" opacity="0.4"/>
  <text x="245" y="366" font-family="Helvetica" font-weight="bold" font-size="10" fill="#ffffff">1:02</text>

  <!-- grid row 4 : y 373 -->
  <rect x="0" y="373" width="79" height="79" fill="url(#p7)"/>
  <rect x="80" y="373" width="79" height="79" fill="url(#p4)"/>
  <rect x="160" y="373" width="79" height="79" fill="url(#p6)"/>
  <rect x="240" y="373" width="80" height="79" fill="url(#p1)"/>

  <!-- next section header peeking : y 453 -->
  <rect x="0" y="453" width="320" height="25" fill="url(#hdr)"/>
  <rect x="0" y="452" width="320" height="1" fill="#d5dee5"/>
  <text x="10" y="471" font-family="Helvetica" font-weight="bold" font-size="15" fill="#ffffff">July 2026</text>
  <text x="10" y="470" font-family="Helvetica" font-weight="bold" font-size="15" fill="#697487">July 2026</text>
  <rect x="0" y="478" width="320" height="2" fill="#ffffff"/>
</svg>
