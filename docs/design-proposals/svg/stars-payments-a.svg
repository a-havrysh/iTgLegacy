<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <path id="starpath" d="M0,-1 L0.281,-0.387 L0.951,-0.309 L0.455,0.148 L0.588,0.809 L0,0.478 L-0.588,0.809 L-0.455,0.148 L-0.951,-0.309 L-0.281,-0.387 Z"/>
    <clipPath id="thumbclip"><rect x="20" y="86" width="60" height="60" rx="5" ry="5"/></clipPath>
  </defs>

  <!-- patterned grouped-table ground (SettingsBackground, 320x35pt tile) -->
  <rect x="0" y="0" width="320" height="480" fill="#CAD1DC"/>
  <image x="0" y="64" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="99" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="134" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="169" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="204" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="239" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="274" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="309" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="344" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="379" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="414" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>
  <image x="0" y="449" width="320" height="35" xlink:href="ASSET:SettingsBackground"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="12" fill="#FFFFFF">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">9:41</text>
  <text x="314" y="14" font-family="Helvetica" font-size="12" fill="#FFFFFF" text-anchor="end">64%</text>

  <!-- navigation bar -->
  <image x="0" y="20" width="320" height="44" xlink:href="ASSET:NavBarBackground"/>
  <image x="5" y="27" width="54" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="32" y="45" font-family="Helvetica" font-size="12" font-weight="bold" fill="#3D5C81" text-anchor="middle">Cancel</text>
  <text x="32" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cancel</text>
  <text x="160" y="47" font-family="Helvetica" font-size="16" font-weight="bold" fill="#3D5C81" text-anchor="middle">Checkout</text>
  <text x="160" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Checkout</text>

  <!-- group 1: product header, 78pt -->
  <rect x="10" y="76" width="300" height="78" rx="8" ry="8" fill="#FFFFFF"/>
  <rect x="20" y="86" width="60" height="60" rx="5" ry="5" fill="#8F3BF7"/>
  <g clip-path="url(#thumbclip)">
    <circle cx="50" cy="112" r="17" fill="#A968FA"/>
    <text x="50" y="122" font-family="Helvetica" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>
  </g>
  <text x="90" y="102" font-family="Helvetica" font-size="16" font-weight="bold" fill="#111111">Cat Stickers Pack</text>
  <text x="90" y="120" font-family="Helvetica" font-size="14" fill="#888888">20 stickers, delivered to this chat</text>
  <text x="90" y="138" font-family="Helvetica" font-size="14" fill="#888888">@CatStickersBot</text>

  <!-- group 2: price parts, two 44pt rows -->
  <rect x="10" y="166" width="300" height="88" rx="8" ry="8" fill="#FFFFFF"/>
  <rect x="20" y="209.5" width="290" height="1" fill="#D5DEE5"/>
  <text x="20" y="194" font-family="Helvetica" font-size="17" fill="#516691">Sticker pack</text>
  <use xlink:href="#starpath" transform="translate(280,188.5) scale(6)" fill="#E09602"/>
  <text x="300" y="194" font-family="Helvetica" font-size="17" fill="#356596" text-anchor="end">75</text>
  <text x="20" y="238" font-family="Helvetica" font-size="17" font-weight="bold" fill="#516691">Total</text>
  <use xlink:href="#starpath" transform="translate(280,232.5) scale(6)" fill="#E09602"/>
  <text x="300" y="238" font-family="Helvetica" font-size="17" font-weight="bold" fill="#356596" text-anchor="end">75</text>

  <!-- comment under the price group -->
  <text x="20" y="273" font-family="Helvetica" font-size="14" fill="#DAE0E8">Balance 214 stars. 139 will remain after this</text>
  <text x="20" y="272" font-family="Helvetica" font-size="14" fill="#697487">Balance 214 stars. 139 will remain after this</text>
  <text x="20" y="290" font-family="Helvetica" font-size="14" fill="#DAE0E8">purchase.</text>
  <text x="20" y="289" font-family="Helvetica" font-size="14" fill="#697487">purchase.</text>

  <!-- group 3: two disclosure rows -->
  <rect x="10" y="302" width="300" height="88" rx="8" ry="8" fill="#FFFFFF"/>
  <rect x="20" y="345.5" width="290" height="1" fill="#D5DEE5"/>
  <text x="20" y="330" font-family="Helvetica" font-size="17" fill="#516691">Pay to</text>
  <text x="296" y="330" font-family="Helvetica" font-size="16" fill="#356596" text-anchor="end">CatStickersBot</text>
  <image x="299" y="317" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>
  <text x="20" y="374" font-family="Helvetica" font-size="17" fill="#516691">Terms of Service</text>
  <image x="299" y="361" width="9" height="16" xlink:href="ASSET:MenuDisclosureIndicator"/>

  <!-- confirm row: green grouped action button -->
  <image x="10" y="404" width="300" height="43" xlink:href="ASSET:GroupedActionButtonGreen"/>
  <use xlink:href="#starpath" transform="translate(134,424.5) scale(7)" fill="#FFFFFF"/>
  <text x="146" y="431" font-family="Helvetica" font-size="14" font-weight="bold" fill="#124606">Pay 75 Stars</text>
  <text x="146" y="430" font-family="Helvetica" font-size="14" font-weight="bold" fill="#FFFFFF">Pay 75 Stars</text>

  <text x="20" y="466" font-family="Helvetica" font-size="14" fill="#DAE0E8">Stars are not refundable by Telegram.</text>
  <text x="20" y="465" font-family="Helvetica" font-size="14" fill="#697487">Stars are not refundable by Telegram.</text>
</svg>
