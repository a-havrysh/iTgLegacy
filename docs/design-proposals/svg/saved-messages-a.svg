<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="480"/></clipPath>
    <g id="star">
      <polygon points="0,-7 1.76,-2.43 6.66,-2.16 2.85,0.93 4.11,5.66 0,3 -4.11,5.66 -2.85,0.93 -6.66,-2.16 -1.76,-2.43"/>
    </g>
    <g id="pin">
      <circle cx="0" cy="-2" r="4.5"/>
      <rect x="-1" y="1" width="2" height="6"/>
    </g>
    <g id="book">
      <rect x="-5.5" y="-6" width="11" height="12" rx="1.5" ry="1.5"/>
    </g>
  </defs>
  <g clip-path="url(#screen)">
  <rect x="0" y="0" width="320" height="480" fill="#c9d3de"/>
  <image x="0" y="100" width="320" height="380" preserveAspectRatio="xMidYMid slice" xlink:href="ASSET:builtin-wallpaper-0"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="11" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4:21 PM</text>
  <text x="314" y="14" font-family="Helvetica" font-size="11" fill="#ffffff" text-anchor="end">86%</text>

  <!-- navigation bar -->
  <rect x="0" y="20" width="320" height="44" fill="url(#nav)"/>
  <image x="5" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:BackButton"/>
  <text x="45" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chats</text>
  <image x="253" y="27" width="62" height="30" preserveAspectRatio="none" xlink:href="ASSET:HeaderButton"/>
  <text x="284" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">From</text>
  <text x="160" y="48" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Saved Messages</text>

  <!-- tag scope strip, 36pt -->
  <image x="0" y="64" width="320" height="36" preserveAspectRatio="none" xlink:href="ASSET:SearchBarBackground"/>
  <image x="6" y="67" width="44" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton_Highlighted"/>
  <text x="28" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">All</text>

  <image x="54" y="67" width="74" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <use xlink:href="#star" x="0" y="0" transform="translate(68,82)" fill="#e09602"/>
  <text x="79" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b">Ideas</text>

  <image x="132" y="67" width="74" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <use xlink:href="#pin" x="0" y="0" transform="translate(146,81)" fill="#ee4928"/>
  <text x="157" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b">To read</text>

  <image x="210" y="67" width="72" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <use xlink:href="#book" x="0" y="0" transform="translate(224,82)" fill="#0f94ed"/>
  <text x="235" y="86" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b">Work</text>

  <image x="286" y="67" width="28" height="30" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <text x="300" y="87" font-family="Helvetica" font-size="14" font-weight="bold" fill="#5c708b" text-anchor="middle">+</text>

  <!-- day divider -->
  <rect x="130" y="106" width="60" height="18" rx="9" ry="9" fill="#7a8ea3" opacity="0.75"/>
  <text x="160" y="119" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Today</text>

  <!-- bubble 1: forwarded, tagged -->
  <image x="96" y="130" width="216" height="94" preserveAspectRatio="none" xlink:href="ASSET:Msg_Out"/>
  <text x="107" y="147" font-family="Helvetica" font-size="10" fill="#3a8e26">Forwarded from</text>
  <text x="107" y="161" font-family="Helvetica" font-size="13" font-weight="bold" fill="#169600">Alice Kovalenko</text>
  <text x="107" y="180" font-family="Helvetica" font-size="15" fill="#141617">deploy checklist lives in the</text>
  <text x="107" y="196" font-family="Helvetica" font-size="15" fill="#141617">wiki under Release/2014</text>
  <image x="107" y="200" width="66" height="20" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <use xlink:href="#book" x="0" y="0" transform="translate(118,210) scale(0.85)" fill="#0f94ed"/>
  <text x="128" y="214" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b">Work</text>
  <text x="303" y="216" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">14:02</text>

  <!-- bubble 2: own note, untagged -->
  <image x="168" y="230" width="144" height="46" preserveAspectRatio="none" xlink:href="ASSET:Msg_Out"/>
  <text x="179" y="253" font-family="Helvetica" font-size="15" fill="#141617">buy tickets on Friday</text>
  <text x="303" y="268" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">14:19</text>

  <!-- bubble 3: forwarded from a group, two tags -->
  <image x="72" y="282" width="240" height="112" preserveAspectRatio="none" xlink:href="ASSET:Msg_Out"/>
  <text x="83" y="299" font-family="Helvetica" font-size="10" fill="#3a8e26">Forwarded from</text>
  <text x="83" y="313" font-family="Helvetica" font-size="13" font-weight="bold" fill="#169600">Design Team</text>
  <text x="83" y="332" font-family="Helvetica" font-size="15" fill="#141617">the type scale is frozen: 19 / 17 /</text>
  <text x="83" y="348" font-family="Helvetica" font-size="15" fill="#141617">16 / 15 / 14 / 13 / 12 / 11</text>
  <image x="83" y="356" width="66" height="20" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <use xlink:href="#book" x="0" y="0" transform="translate(94,366) scale(0.85)" fill="#0f94ed"/>
  <text x="104" y="370" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b">Work</text>
  <image x="153" y="356" width="64" height="20" preserveAspectRatio="none" xlink:href="ASSET:SearchBarScopeButton"/>
  <use xlink:href="#star" x="0" y="0" transform="translate(164,366) scale(0.8)" fill="#e09602"/>
  <text x="174" y="370" font-family="Helvetica" font-size="12" font-weight="bold" fill="#5c708b">Ideas</text>
  <text x="303" y="386" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">Mon</text>

  <!-- bubble 4 partial -->
  <image x="200" y="400" width="112" height="46" preserveAspectRatio="none" xlink:href="ASSET:Msg_Out"/>
  <text x="211" y="423" font-family="Helvetica" font-size="15" fill="#141617">call the bank</text>
  <text x="303" y="438" font-family="Helvetica" font-size="11" fill="#232d37" text-anchor="end">Mon</text>

  <!-- input panel -->
  <image x="0" y="435" width="320" height="45" preserveAspectRatio="none" xlink:href="ASSET:ConversationInputPanel"/>
  <image x="6" y="443" width="30" height="30" xlink:href="ASSET:AttachBtn"/>
  <image x="40" y="442" width="212" height="32" preserveAspectRatio="none" xlink:href="ASSET:textbg"/>
  <text x="50" y="463" font-family="Helvetica" font-size="16" fill="#9da7b3">Message</text>
  <image x="256" y="442" width="58" height="32" preserveAspectRatio="none" xlink:href="ASSET:SendButton"/>
  <text x="285" y="463" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Send</text>
  </g>
</svg>
