<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="480">
  <defs>
    <linearGradient id="navbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7699c0"/>
      <stop offset="1" stop-color="#42678f"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b8fb8"/><stop offset="1" stop-color="#25384f"/>
    </linearGradient>
    <clipPath id="coverclip"><rect x="10" y="126" width="300" height="120"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="480" fill="#ffffff"/>

  <!-- status bar -->
  <rect x="0" y="0" width="320" height="20" fill="#000000"/>
  <text x="6" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff">Telegram</text>
  <text x="160" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9:41</text>
  <text x="314" y="14" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">78%</text>

  <!-- navigation bar: title is the host, subtitle is the load state -->
  <rect x="0" y="20" width="320" height="44" fill="url(#navbg)"/>
  <image x="5" y="27" width="58" height="30" xlink:href="ASSET:BackButton"/>
  <text x="39" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Chat</text>
  <text x="160" y="41" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">theverge.com</text>
  <text x="160" y="56" font-family="Helvetica" font-size="13" fill="#c9dcf2" text-anchor="middle">Loading…</text>
  <image x="255" y="27" width="60" height="30" xlink:href="ASSET:HeaderButton"/>
  <text x="285" y="46" font-family="Helvetica" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Share</text>

  <!-- 2pt load progress under the bar -->
  <rect x="0" y="64" width="320" height="2" fill="#d5dee5"/>
  <rect x="0" y="64" width="196" height="2" fill="#0779d0"/>

  <!-- UIWebView content: locally generated HTML, web typography, 10pt body margin -->
  <text x="10" y="86" font-family="Helvetica" font-size="19" font-weight="bold" fill="#000000">Telegram rebuilds its iOS</text>
  <text x="10" y="106" font-family="Helvetica" font-size="19" font-weight="bold" fill="#000000">client for older iPhones</text>
  <text x="10" y="121" font-family="Helvetica" font-size="13" fill="#666666">Nikita Vlasov · 14 Aug 2013</text>

  <rect x="10" y="126" width="300" height="120" fill="url(#cover)"/>
  <g clip-path="url(#coverclip)">
    <circle cx="62" cy="158" r="18" fill="#a8c3de" opacity="0.65"/>
    <path d="M10 246 L96 172 L164 224 L232 176 L310 246 Z" fill="#182a3d" opacity="0.85"/>
  </g>

  <text x="10" y="266" font-family="Helvetica" font-size="15" fill="#000000">The reader is a UIWebView fed a local</text>
  <text x="10" y="285" font-family="Helvetica" font-size="15" fill="#000000">HTML file built from the page blocks.</text>
  <text x="10" y="304" font-family="Helvetica" font-size="15" fill="#000000">See <tspan fill="#0000ee" text-decoration="underline">the earlier report</tspan> for context.</text>

  <!-- an embedded block that iOS 6 cannot run, degraded in place -->
  <rect x="10" y="316" width="300" height="86" fill="#eef1f4" stroke="#d5dee5"/>
  <rect x="10" y="316" width="300" height="24" fill="#e4e9f0"/>
  <text x="20" y="333" font-family="Helvetica" font-size="12" font-weight="bold" fill="#697487">EMBEDDED VIDEO</text>
  <circle cx="52" cy="371" r="16" fill="#ffffff" stroke="#b9c2cc"/>
  <path d="M47 363 L62 371 L47 379 Z" fill="#697487"/>
  <text x="80" y="366" font-family="Helvetica" font-size="14" font-weight="bold" fill="#141617">Cannot play here</text>
  <text x="80" y="383" font-family="Helvetica" font-size="14" fill="#62768a">Tap to open in Safari</text>

  <text x="10" y="424" font-family="Helvetica" font-size="15" fill="#000000">Scrolling is the web view’s own, so the</text>
  <text x="10" y="443" font-family="Helvetica" font-size="15" fill="#000000">page can rubber-band past the chrome.</text>
  <rect x="313" y="70" width="3" height="120" rx="1.5" ry="1.5" fill="#000000" opacity="0.35"/>

  <!-- browser toolbar -->
  <image x="0" y="436" width="320" height="44" xlink:href="ASSET:Footer"/>
  <image x="10" y="443" width="44" height="30" xlink:href="ASSET:ButtonGroupLeft"/>
  <image x="54" y="443" width="1" height="30" xlink:href="ASSET:ButtonGroupDivider"/>
  <image x="55" y="443" width="44" height="30" xlink:href="ASSET:ButtonGroupCenter"/>
  <image x="99" y="443" width="1" height="30" xlink:href="ASSET:ButtonGroupDivider"/>
  <image x="100" y="443" width="44" height="30" xlink:href="ASSET:ButtonGroupRight"/>
  <path d="M37 452 L27 458 L37 464 Z" fill="#5c6b7d"/>
  <path d="M72 452 L82 458 L72 464 Z" fill="#a8b1bb"/>
  <path d="M122 465 L122 451 M116 457 L122 451 L128 457" stroke="#5c6b7d" stroke-width="2" fill="none"/>
  <image x="212" y="443" width="98" height="30" xlink:href="ASSET:GroupedActionButton"/>
  <text x="261" y="463" font-family="Helvetica" font-size="12" font-weight="bold" fill="#4a6587" text-anchor="middle">Open in Safari</text>
</svg>
